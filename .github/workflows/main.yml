            /// matras stop being split off with a space of their own.
            static String _textFromResult(RecognizedText t) {
              final out = StringBuffer();
              for (final b in t.blocks) {
                for (final l in b.lines) {
                  final els = l.elements;
                  if (els.isEmpty) {
                    if (l.text.trim().isNotEmpty) out.writeln(l.text.trim());
                    continue;
                  }
                  TextElement? prev;
                  for (final e in els) {
                    if (prev != null) {
                      final pr = prev.boundingBox;
                      final er = e.boundingBox;
                      final h = (er.bottom - er.top).abs();
                      final gap = er.left - pr.right;
                      if (gap > h * 0.45) out.write(' ');
                    }
                    out.write(e.text);
                    prev = e;
                  }
                  out.write('\\n');
                }
                out.write('\\n');
              }
              final rebuilt = out.toString().trim();
