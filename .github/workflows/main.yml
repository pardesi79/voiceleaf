    - name: Join the letters back into words
      run: "cat > /tmp/patch_symbols.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\nhelper = '''  /// ML Kit cuts Devanagari words at every vowel mark, so \"आंतरिक\" comes back\n  /// as \"आंतरि क\". Rebuilding the line from the single characters and their\n  /// own boxes puts a space only where there is a real gap.\n  static String _joinSymbols(RecognizedText t) {\n    final out = StringBuffer();\n    for (final b in t.blocks) {\n      for (final l in b.lines) {\n        double? lastRight;\n        double? height;\n        for (final sym in l.symbols) {\n          final r = sym.boundingBox;\n          final h = (r.bottom - r.top).abs();\n          if (lastRight != null && height != null) {\n            if ((r.left - lastRight) > height * 0.32) out.write(' ');\n          }\n          out.write(sym.text);\n          lastRight = r.right;\n          height = h;\n        }\n        out.write('\\\\n');\n      }\n      out.write('\\\\n');\n    }\n    final rebuilt = out.toString().trim();\n    return rebuilt.isEmpty ? t.text : rebuilt;\n  }\n\n'''\nanchor = \"  /// Reads one image on the phone with Google ML Kit (offline).\"\nif '_joinSymbols' not in s and anchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('extractors: symbol rebuild')\n\nif 'return t.text;' in s:\n    s = s.replace('return t.text;', 'return _joinSymbols(t);', 1)\n    changed.append('extractors: use symbol rebuild')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_symbols.py\n"
