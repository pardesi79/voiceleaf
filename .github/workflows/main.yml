          }
          """

          if 'text-recognition-devanagari' not in s:
              s += deps
          if 'isMinifyEnabled = false' not in s and 'minifyEnabled false' not in s:
              s += extra
          app.write_text(s)
          print('patched', app)

          root = None
          for name in ('android/build.gradle.kts', 'android/build.gradle'):
              if os.path.exists(name):
                  root = pathlib.Path(name)
                  break
          if root is not None:
              r = root.read_text()
              if 'lintVital' not in r:
                  root.write_text(r + root_extra)
                  print('patched', root)
          PY
          python3 /tmp/patch_gradle.py

      - name: Take the OCR models from Play Services
        run: |
          cat > /tmp/patch_mlkit2.py <<'PY'
          import glob, os, pathlib, re

          changed = []

          # ---------- 1. the plugin itself must compile against the Play Services classes
          for g in glob.glob(os.path.expanduser(
                  '~/.pub-cache/hosted/pub.dev/google_mlkit_text_recognition-*/android/build.gradle')):
              p = pathlib.Path(g)
              s = p.read_text()
              if 'play-services-mlkit-text-recognition' in s:
                  continue
              old = '''        implementation("com.google.mlkit:text-recognition:16.0.1")
                  compileOnly("com.google.mlkit:text-recognition-chinese:16.0.1")
                  compileOnly("com.google.mlkit:text-recognition-devanagari:16.0.1")
                  compileOnly("com.google.mlkit:text-recognition-japanese:16.0.1")
                  compileOnly("com.google.mlkit:text-recognition-korean:16.0.1")'''
              new = '''        compileOnly("com.google.android.gms:play-services-mlkit-text-recognition:19.0.2")
                  compileOnly("com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.2")
                  compileOnly("com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2")
                  compileOnly("com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.2")
                  compileOnly("com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.2")'''
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s)
                  changed.append('plugin: ' + p.parts[-3])

          # ---------- 2. the app brings the models from Play Services at run time
          app = None
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if os.path.exists(name):
                  app = pathlib.Path(name)
                  break

          if app is not None:
              kts = app.name.endswith('.kts')
              s = app.read_text()
              if kts:
                  bundled = [
                      'implementation("com.google.mlkit:text-recognition:16.0.1")',
                      'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
                      'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
                      'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
                      'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
                  ]
                  wanted = '''    implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.2")
              implementation("com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2")'''
              else:
                  bundled = [
                      "implementation 'com.google.mlkit:text-recognition:16.0.1'",
                      "implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'",
                      "implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'",
                      "implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'",
                      "implementation 'com.google.mlkit:text-recognition-korean:16.0.1'",
                  ]
                  wanted = '''    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.2'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2' '''
              for b in bundled:
                  if b in s:
                      s = s.replace(b, '', 1)
                      changed.append('app: dropped bundled model')
              if 'play-services-mlkit-text-recognition' not in s:
                  s = s.replace('dependencies {', 'dependencies {\n' + wanted, 1)
                  changed.append('app: play services models')
              app.write_text(s)

          # ---------- 3. ask Play Services to fetch the models when the app is installed
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              x = mf.read_text()
              if 'com.google.mlkit.vision.DEPENDENCIES' not in x:
                  x = x.replace('<application',
                                '<application', 1)
                  x = re.sub(r'(<application[^>]*>)',
                             r'\1\n        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" '
                             r'android:value="ocr,ocr_devanagari" />', x, count=1)
                  mf.write_text(x)
                  changed.append('manifest: model download')

          print('patched:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/patch_mlkit2.py

      - name: Build the APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Put the phone APK where it can be downloaded directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk voiceleaf.apk
          gh release create latest voiceleaf.apk \
            --title "Voiceleaf latest" \
            --notes "Built from the newest commit. Download voiceleaf.apk and install it." \
            --latest || gh release upload latest voiceleaf.apk --clobber

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
