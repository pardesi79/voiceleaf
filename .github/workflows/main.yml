          # while reading the picture can never be. The only repair needed is the doubled
          # vowel mark this PDF family writes ("ज्ञाान" -> "ज्ञान").
          helper = '''
            /// Folds a vowel mark the PDF wrote twice into one.
            static String _foldMarks(String t) => t.replaceAllMapped(
                RegExp(r'([\\u093E-\\u094D][\\u0902\\u0903]?)\\1+'), (m) => m[1]!);

            /// Reads the words stored inside the PDF, page by page. An empty list means
            /// the file is only a picture, and the caller should fall back to OCR.
            static Future<List<String>> _fromTextLayer(String path, int from, int to) async {
              try {
                final doc = await PDFDoc.fromPath(path);
                final out = <String>[];
                for (var i = from; i <= to; i++) {
                  if (i - 1 >= doc.length) break;
                  final t = _foldMarks(await doc.pages[i - 1].text).trim();
                  out.add(t);
                }
                return out;
              } catch (_) {
                return const [];
              }
            }

