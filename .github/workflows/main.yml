                            const SizedBox(height: 6),
                            DropdownButtonFormField<String>(
                              isExpanded: true,
                              value: _engines.any((e) => e['name'] == _selectedEngine) ? _selectedEngine : null,
                              items: _engines
                                  .map((e) => DropdownMenuItem<String>(
                                        value: e['name'],
                                        child: Text('${e['label']} (${e['name']})', overflow: TextOverflow.ellipsis),
                                      ))
                                  .toList(),
                              onChanged: (eng) async {
                                if (eng == null) return;
                                _selectedEngine = eng;
                                _selectedVoice = '';
                                try {
                                  await widget.tts?.setEngine(eng);
                                } catch (_) {}
                                await _loadCatalog(eng);
                              },
                            ),
                            const SizedBox(height: 16),
                            Text(
                              '3. Select Voice (${matchingVoices.length} available)',
                              style: const TextStyle(fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 6),
                            DropdownButtonFormField<String>(
                              isExpanded: true,
                              value: matchingVoices.any((v) => v['name'] == _selectedVoice)
                                  ? _selectedVoice
