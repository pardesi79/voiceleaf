urEnd = off;\n      });\n      _save();\n    }\"\"\"\nnew5 = \"\"\"    _pausedByUser = true;\n    tts.stop();\n    _play(off);\"\"\"\nif old5 in s:\n    s = s.replace(old5, new5, 1)\n    changed.append('player: jump always speaks')\n\np.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/p.py\n"
    - name: Add the PDF library InstaReader uses
      run: "cat > /tmp/p.py <<'PY'\nimport pathlib, glob\n\nchanged = []\nnotes = []\n\n# ---------- 1. the PDF library InstaReader carries\ncands = [c for c in sorted(glob.glob('android/**/build.gradle*', recursive=True))\n         if 'app' in c and 'settings' not in c and 'plugin' not in c]\nif not cands:\n    notes.append('NO GRADLE FILE')\nelse:\n    g = pathlib.Path(cands[0])\n    s = g.read_text()\n    if 'pdfbox' not in s:\n        dep = ('    implementation(\"com.tom-roush:pdfbox-android:1.8.10.3\")\\n'\n               if g.name.endswith('.kts') else\n               \"    implementation 'com.tom-roush:pdfbox-android:1.8.10.3'\\n\")\n        if 'dependencies {' in s:\n            s = s.replace('dependencies {', 'dependencies {\\n' + dep, 1)\n        else:\n            s += '\\ndependencies {\\n' + dep + '}\\n'\n        g.write_text(s)\n        changed.append('gradle ' + g.name)\n    else:\n        notes.append('pdfbox already present')\n\n# ---------- 2. the bridge, only if it is not there yet\nkt = None\nfor p in pathlib.Path('android/app/src/main').rglob('MainActivity.kt'):\n    kt = p\nif kt is None:\n    notes.append('NO MainActivity.kt')\nelse:\n    t = kt.read_text()\n    if 'voiceleaf/pdftext' not in t:\n        channel = (\n            '        io.flutter.plugin.common.MethodChannel(\\n'\n            '            flutterEngine.dartExecutor.binaryMessenger, \"voiceleaf/pdftext\"\\n'\n            '        ).setMethodCallHandler { call, result ->\\n'\n            '            if (call.method != \"page\") {\\n'\n            '                result.notImplemented()\\n'\n            '                return@setMethodCallHandler\\n'\n            '            }\\n'\n            '            val path = call.argument<String>(\"path\")\\n'\n            '            val index = call.argument<Int>(\"index\") ?: 0\\n'\n            '            try {\\n'\n            '                com.tom_roush.pdfbox.util.PDFBoxResourceLoader.init(applicationContext)\\n'\n            '                val doc = com.tom_roush.pdfbox.pdmodel.PDDocument.load(java.io.File(path))\\n'\n            '                try {\\n'\n            '                    val s = com.tom_roush.pdfbox.text.PDFTextStripper()\\n'\n            '                    s.startPage = index + 1\\n'\n            '                    s.endPage = index + 1\\n'\n            '                    result.success(s.getText(doc))\\n'\n            '                } finally {\\n'\n            '                    doc.close()\\n'\n            '                }\\n'\n            '            } catch (e: Throwable) {\\n'\n            '                result.success(\"\")\\n'\n            '            }\\n'\n            '        }\\n'\n        )\n        marker = 'super.configureFlutterEngine(flutterEngine)'\n        if marker in t:\n            kt.write_text(t.replace(marker, marker + '\\n' + channel, 1))\n            changed.append('MainActivity bridge')\n        else:\n            notes.append('no configureFlutterEngine')\n    else:\n        notes.append('bridge already present')\n\n# ---------- 3. the Dart side: keep whatever block is there, add the hole guard\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\nhelper = '''  static const MethodChannel _pdfText = MethodChannel('voiceleaf/pdftext');\n\n  /// Reads a page's own text with PdfBox, the library InstaReader carries.\n  static Future<String> pdfTextOf(String path, int index) async {\n    try {\n      final t = await _pdfText.invokeMethod<String>('page', {\n        'path': path,\n        'index': index,\n      });\n      return (t ?? '').trim();\n    } catch (_) {\n      return '';\n    }\n  }\n\n'''\nanchor = \"  /// Reads one image on the phone with Google ML Kit (offline).\"\nif '_pdfText = MethodChannel' not in s and anchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('dart helper')\n\nguard = \"        if (layer.contains('\\\\u0000')) layer = '';\\n\"\ncall = \"        var layer = await pdfTextOf(path, i - 1);\\n\"\nif call in s:\n    # the block is already there: only make sure the hole guard sits right after it\n    if guard not in s:\n        s = s.replace(call, call + guard, 1)\n        changed.append('hole guard added')\n    else:\n        notes.append('guard already present')\nelse:\n    old = \"\"\"        final w = page.width;\n        final h = page.height;\"\"\"\n    new = (call + guard +\n           \"\"\"        if (layer.length > 40) {\n          pages.add(repairIndic(pageNumbers ? 'Page $i.\\\\n$layer' : layer));\n          onProgress(i - from + 1, total, layer.length);\n          continue;\n        }\n\"\"\" + old)\n    if old in s:\n        s = s.replace(old, new, 1)\n        changed.append('dart block added')\n\nex.write_text(s)\nprint('CHANGED:', ', '.join(changed) if changed else 'nothing')\nprint('NOTES:', '; '.join(notes) if notes else 'none')\nprint('layer declarations:', s.count('var layer = await pdfTextOf'))\nPY\npython3 /tmp/p.py\n"
    - name: Never take the page text from the PDF
      run: "cat > /tmp/p.py <<'PY'\nimport pathlib, re\n\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\nbefore = s\n\n# This PDF writes part of its own letters as \"no character\", so text taken out\n# of it comes back with a hole where the vowel mark belongs. The picture of the\n# page has no such fault, so never take the page text from pdfium.\ns = re.sub(r'await\\s+page\\.loadText\\(\\)', \"''\", s)\ns = re.sub(r'await\\s+doc\\.pages\\[[^\\]]*\\]\\.loadText\\(\\)', \"''\", s)\ns = s.replace(\"\"\"        var layer = '';\n        try {\n          final raw = '';\n          layer = raw == null ? '' : _tidyLayer(raw);\n        } catch (_) {}\n\"\"\", \"\"\"        var layer = '';\n\"\"\")\n\nex.write_text(s)\nprint('loadText left:', s.count('loadText'), '| changed:', s != before)\nPY\npython3 /tmp/p.py\n"
    - name: Fetch packages
      run: flutter pub get
    - name: Raise the Android SDK level and add the text recognition scripts
      run: "cat > /tmp/patch_gradle.py <<'PY'\nimport os, re, pathlib, glob\n\ndef bump(text):\n    text = re.sub(r'compileSdkVersion\\s+(flutter\\.compileSdkVersion|\\d+)', 'compileSdkVersion 36', text)\n    text = re.sub(r'compileSdk\\s*=\\s*(flutter\\.compileSdkVersion|\\d+)', 'compileSdk = 36', text)\n    text = re.sub(r'compileSdk\\s+(flutter\\.compileSdkVersion|\\d+)', 'compileSdk 36', text)\n    return text\n\nfixed = 0\nfor g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle*')):\n    p = pathlib.Path(g)\n    try:\n        s = p.read_text()\n    except Exception:\n        continue\n    n = bump(s)\n    if n != s:\n        p.write_text(n)\n        fixed += 1\nprint('plugin gradle files raised:', fixed)\n\napp = None\nfor name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):\n    if os.path.exists(name):\n        app = pathlib.Path(name)\n        break\nif app is None:\n    raise SystemExit('app gradle not found')\n\ns = app.read_text()\ns = bump(s)\n\nkts = app.name.endswith('.kts')\nif kts:\n    extra = \"\"\"\nandroid {\n    signingConfigs {\n        create(\"release\") {\n            storeFile = file(\"voiceleaf.jks\")\n            storePassword = \"voiceleaf123\"\n            keyAlias = \"voiceleaf\"\n            keyPassword = \"voiceleaf123\"\n        }\n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            signingConfig = signingConfigs.getByName(\"release\")\n        }\n    }\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n\"\"\"\n    deps = \"\"\"\ndependencies {\n    implementation(\"com.google.mlkit:text-recognition:16.0.1\")\n    implementation(\"com.google.mlkit:text-recognition-devanagari:16.0.1\")\n    implementation(\"com.google.mlkit:text-recognition-chinese:16.0.1\")\n    implementation(\"com.google.mlkit:text-recognition-japanese:16.0.1\")\n    implementation(\"com.google.mlkit:text-recognition-korean:16.0.1\")\n    implementation(\"com.microsoft.onnxruntime:onnxruntime-android:1.20.0\")\n}\n\"\"\"\n    root_extra = \"\"\"\nsubprojects {\n    tasks.matching { it.name.startsWith(\"lintVital\") }.configureEach { enabled = false }\n}\n\"\"\"\nelse:\n    extra = \"\"\"\nandroid {\n    signingConfigs {\n        release {\n            storeFile file(\"voiceleaf.jks\")\n            storePassword \"voiceleaf123\"\n            keyAlias \"voiceleaf\"\n            keyPassword \"voiceleaf123\"\n        }\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n            signingConfig signingConfigs.release\n        }\n    }\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n\"\"\"\n    deps = \"\"\"\ndependencies {\n    implementation 'com.google.mlkit:text-recognition:16.0.1'\n    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'\n    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'\n    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'\n    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'\n    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'\n}\n\"\"\"\n    root_extra = \"\"\"\nsubprojects {\n    tasks.matching { it.name.startsWith('lintVital') }.configureEach { enabled = false }\n}\n\"\"\"\n\nif 'text-recognition-devanagari' not in s:\n    s += deps\nif 'isMinifyEnabled = false' not in s and 'minifyEnabled false' not in s:\n    s += extra\napp.write_text(s)\nprint('patched', app)\n\nroot = None\nfor name in ('android/build.gradle.kts', 'android/build.gradle'):\n    if os.path.exists(name):\n        root = pathlib.Path(name)\n        break\nif root is not None:\n    r = root.read_text()\n    if 'lintVital' not in r:\n        root.write_text(r + root_extra)\n        print('patched', root)\nPY\npython3 /tmp/patch_gradle.py\n"
    - name: Take the OCR models from Play Services
      run: "cat > /tmp/patch_mlkit2.py <<'PY'\nimport glob, os, pathlib, re\n\nchanged = []\n\n# ---------- 1. the plugin itself must compile against the Play Services classes\nfor g in glob.glob(os.path.expanduser(\n        '~/.pub-cache/hosted/pub.dev/google_mlkit_text_recognition-*/android/build.gradle')):\n    p = pathlib.Path(g)\n    s = p.read_text()\n    if 'play-services-mlkit-text-recognition' in s:\n        continue\n    old = '''        implementation(\"com.google.mlkit:text-recognition:16.0.1\")\n        compileOnly(\"com.google.mlkit:text-recognition-chinese:16.0.1\")\n        compileOnly(\"com.google.mlkit:text-recognition-devanagari:16.0.1\")\n        compileOnly(\"com.google.mlkit:text-recognition-japanese:16.0.1\")\n        compileOnly(\"com.google.mlkit:text-recognition-korean:16.0.1\")'''\n    new = '''        compileOnly(\"com.google.android.gms:play-services-mlkit-text-recognition:19.0.2\")\n        compileOnly(\"com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.2\")\n        compileOnly(\"com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2\")\n        compileOnly(\"com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.2\")\n        compileOnly(\"com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.2\")'''\n    if old in s:\n        s = s.replace(old, new, 1)\n        p.write_text(s)\n        changed.append('plugin: ' + p.parts[-3])\n\n# ---------- 2. the app brings the models from Play Services at run time\napp = None\nfor name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):\n    if os.path.exists(name):\n        app = pathlib.Path(name)\n        break\n\nif app is not None:\n    kts = app.name.endswith('.kts')\n    s = app.read_text()\n    if kts:\n        bundled = [\n            'implementation(\"com.google.mlkit:text-recognition:16.0.1\")',\n            'implementation(\"com.google.mlkit:text-recognition-devanagari:16.0.1\")',\n            'implementation(\"com.google.mlkit:text-recognition-chinese:16.0.1\")',\n            'implementation(\"com.google.mlkit:text-recognition-japanese:16.0.1\")',\n            'implementation(\"com.google.mlkit:text-recognition-korean:16.0.1\")',\n        ]\n        wanted = '''    implementation(\"com.google.android.gms:play-services-mlkit-text-recognition:19.0.2\")\n    implementation(\"com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2\")'''\n    else:\n        bundled = [\n            \"implementation 'com.google.mlkit:text-recognition:16.0.1'\",\n            \"implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'\",\n            \"implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'\",\n            \"implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'\",\n            \"implementation 'com.google.mlkit:text-recognition-korean:16.0.1'\",\n        ]\n        wanted = '''    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.2'\n    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.2' '''\n    for b in bundled:\n        if b in s:\n            s = s.replace(b, '', 1)\n            changed.append('app: dropped bundled model')\n    if 'play-services-mlkit-text-recognition' not in s:\n        s = s.replace('dependencies {', 'dependencies {\\n' + wanted, 1)\n        changed.append('app: play services models')\n    app.write_text(s)\n\n# ---------- 3. ask Play Services to fetch the models when the app is installed\nmf = pathlib.Path('android/app/src/main/AndroidManifest.xml')\nif mf.exists():\n    x = mf.read_text()\n    if 'com.google.mlkit.vision.DEPENDENCIES' not in x:\n        x = x.replace('<application',\n                      '<application', 1)\n        x = re.sub(r'(<application[^>]*>)',\n                   r'\\1\\n        <meta-data android:name=\"com.google.mlkit.vision.DEPENDENCIES\" '\n                   r'android:value=\"ocr,ocr_devanagari\" />', x, count=1)\n        mf.write_text(x)\n        changed.append('manifest: model download')\n\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_mlkit2.py\n"
    - name: Build the APK
      run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
    - name: Put the phone APK where it can be downloaded directly
      env:
        GH_TOKEN: ${{ github.token }}
      run: "cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk voiceleaf.apk\ngh release create latest voiceleaf.apk \\\n  --title \"Voiceleaf latest\" \\\n  --notes \"Built from the newest commit. Download voiceleaf.apk and install it.\" \\\n  --latest || gh release upload latest voiceleaf.apk --clobber\n"
    - name: Hand back the APKs
      uses: actions/upload-artifact@v4
      with:
        name: voiceleaf-apk
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 30
