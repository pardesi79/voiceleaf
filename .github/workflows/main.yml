          import pathlib

          # ---------- 1. a detector that cannot mistake English for a legacy font ----------
          detector = r'''

          /// True only when the text really looks like a legacy 8-bit Hindi font.
          /// A plain English page has no Devanagari either, so a percentage test alone
          /// would wrongly push it through the Kruti Dev table and turn it to nonsense.
          /// This looks for the words and letter pairs those fonts actually produce.
          bool isLegacyHindiText(String t) {
            final words = t.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
            if (words.length < 6) return false;
            const markers = <String>{
              'dks', 'ds', 'dh', 'dk', 'ls', 'es', 'esa', 'gS', 'gSa', 'vkSj',
              'fd', 'ij', 'us', ';g', 'og', 'rFkk', 'ugha', 'fy,', 'fd;k', 'x;k',
              'gks', 'Hkh', 'os', 'ge', 'vki', 'tks', 'rks', 'tc', 'rc', 'vc',
              'D;k', 'D;ksafd', 'ysfdu', 'bl', 'ml', 'bu', 'mu', 'Fkk', 'Fkh', 'Fks'
            };
            var hits = 0;
            for (final w in words) {
              final clean = w.replaceAll(RegExp(r'^[.,A(]+|[.,A)]+$'), '');
              if (markers.contains(clean)) hits++;
            }
            final glyphs = RegExp(
                    r'(?:[a-zA-Z][;\[\]/\+\.`~][a-zA-Z]|f[dghjklmnprstvx]|ks|kS|\.[k]|\[k|\?k)')
                .allMatches(t)
                .length;
            return (hits / words.length >= 0.06) || (glyphs / words.length >= 0.12);
          }
          '''

          lf = pathlib.Path('lib/legacy_fonts.dart')
          code = lf.read_text()
