                  if (bytes.isEmpty) {
                    empty++;
                    onProgress(i - from + 1, total, -2);
                    continue;
                  }
                  final f = File('${tmp.path}/pg_$i.png');
                  await f.writeAsBytes(bytes);
                  String text;
