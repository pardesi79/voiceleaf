            /// as "आंतरि क". Rebuilding the line from the single characters and their
            /// own boxes puts a space only where there is a real gap.
            static String _joinSymbols(RecognizedText t) {
              final out = StringBuffer();
              for (final b in t.blocks) {
                for (final l in b.lines) {
