          # 5. Translate Complete Chime (Distinct Google-style crystal double-bell: E5 -> B5 -> E6)
          def sound_translate_done():
              buf = [0.0] * int(RATE * 0.80)
              mix_at(buf, note(659.25, 0.40, 0.28, 0.005, 6.5, (1.0, 0.40, 0.15)), 0.00)
              mix_at(buf, note(987.77, 0.45, 0.28, 0.005, 6.0, (1.0, 0.35, 0.12)), 0.10)
              mix_at(buf, note(1318.51, 0.55, 0.32, 0.005, 4.8, (1.0, 0.30, 0.10)), 0.20)
              return buf

          # 6 & 7. Realistic Book Page Turn Foley (Next = crisp forward swipe, Prev = deeper back flip)
          def realistic_page_turn(forward=True):
              dur = 0.28
              n = int(RATE * dur)
              random.seed(42 if forward else 99)
              out = []
              lp1 = 0.0
              lp2 = 0.0
              alpha1 = 0.28 if forward else 0.20
              alpha2 = 0.62 if forward else 0.48
              for i in range(n):
                  t = i / RATE
                  x = t / dur
                  # Initial finger catch + smooth paper slide + soft landing settle
                  env = (x ** 0.30) * math.exp(-5.0 * x)
                  env += 0.42 * math.exp(-((x - (0.58 if forward else 0.52)) ** 2) / 0.0035)
                  w = random.uniform(-1.0, 1.0)
                  lp1 += alpha1 * (w - lp1)
                  hp = w - lp1
                  lp2 += alpha2 * (hp - lp2)
                  out.append(lp2 * env * 2.8)
              return out

          write_wav('snd_app_open.wav', sound_app_open())
          write_wav('snd_working.wav', sound_working_loop())
          write_wav('snd_complete.wav', sound_complete())
          write_wav('snd_translate_loop.wav', sound_translate_loop())
          write_wav('snd_translate_done.wav', sound_translate_done())
          write_wav('snd_page_next.wav', realistic_page_turn(forward=True))
          write_wav('snd_page_prev.wav', realistic_page_turn(forward=False))
          write_wav('snd_pageflip.wav', realistic_page_turn(forward=True))
          write_wav('snd_tap.wav', note(1046.5, 0.045, 0.20, 0.002, 45.0, (1.0, 0.2)))'''
          gen = pathlib.Path('/tmp/gen_sounds.py')
          gen.write_text(GEN)
          if True:
              r = subprocess.run([sys.executable, str(gen)], capture_output=True, text=True)
              print(r.stdout.strip()[:80] or r.stderr.strip()[:80])
              made = sorted(p.name for p in pathlib.Path('assets').glob('snd_*.wav'))
              print('generated:', len(made), made[:4])

          # the app asks for snd_<name>.wav, which is what the generator writes
          w = pathlib.Path('lib/widgets.dart')
          s = w.read_text()
          changed = []
          if "AssetSource('snd_$name.mp3')" in s:
              s = s.replace("AssetSource('snd_$name.mp3')", "AssetSource('snd_$name.wav')")
              changed.append('the app plays the generated wav files')
          w.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

      - name: Speak with the saved language and voice
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          p = pathlib.Path('lib/player_page.dart')
          s = p.read_text()
          changed = []

          # The player only chose a language when none had been saved, and it stopped
          # the engine immediately before speaking. With a saved preference that left
          # the voice unset, and the stop could swallow the speak that followed - which
          # is the silent original PDF. Apply the saved language and voice every time.
          old = """    if (prefs.str('lang') == null) {
                final code = detectTtsLang(text);
                if (code != _autoLang) {
                  try {
                    await tts.setLanguage(code);
                    _autoLang = code;
                  } catch (_) {}
                }
              }
              await tts.stop();
              if (text.isEmpty) {
                _onDone();
                return;
              }"""
          new = """    // Apply the chosen language every time, not only when nothing was chosen.
              final savedLang = prefs.str('lang');
              final wantLang = savedLang ?? detectTtsLang(text);
              if (wantLang != null && wantLang.isNotEmpty && wantLang != _autoLang) {
                try {
                  await tts.setLanguage(wantLang);
                  _autoLang = wantLang;
                } catch (_) {}
              }
              // and the voice saved for that language, if any
              final wantVoice = prefs.str('voice_$wantLang');
              if (wantVoice != null && wantVoice.isNotEmpty) {
                try {
                  await tts.setVoice({
                    'name': wantVoice,
                    'locale': prefs.str('voice_locale_$wantLang') ?? wantLang,
                  });
                } catch (_) {}
              }
              if (text.isEmpty) {
                _onDone();
                return;
              }
              // no stop() here: on some engines it cancels the speak that follows"""
          if old in s:
              s = s.replace(old, new, 1)
              changed.append('saved language and voice applied before every speak')
          else:
              old2 = """    await tts.stop();
              if (text.isEmpty) {
                _onDone();
                return;
              }"""
              new2 = """    if (text.isEmpty) {
                _onDone();
                return;
              }
              // no stop() here: on some engines it cancels the speak that follows"""
              if old2 in s:
                  s = s.replace(old2, new2, 1)
                  changed.append('removed the stop that swallowed the speak')

          p.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

      - name: His page sound, if he dropped one in
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib, shutil

          # One file from him replaces the page sounds. He named it pageFlip.mp3 and put
          # it in the repo root. No conversion: the app asks for .mp3 first and falls
          # back to .wav, so his file is used exactly as he made it.
          targets = ['snd_page_next', 'snd_page_prev', 'snd_pageflip']
          found = None
          for name in ('pageFlip.mp3', 'pageSound.mp3', 'pageFlip.wav', 'pageSound.wav',
                       'pageFlip.m4a', 'pageSound.m4a'):
              p = pathlib.Path(name)
              if p.exists():
                  found = p
                  break

          if found is None:
              print('no page sound file in the repo - the generated page sounds stay')
          else:
              made = 0
              for t in targets:
                  out = pathlib.Path('assets') / (t + found.suffix.lower())
                  out.parent.mkdir(exist_ok=True)
                  shutil.copy(found, out)
                  made += 1
              print('page sound copied to', made, 'files from', found.name)
          PY
          python3 /tmp/p.py

      - name: Stop the processing sound on every path
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          p = pathlib.Path('lib/create_flow.dart')
          s = p.read_text()
          changed = []

          old = "    WidgetsBinding.instance.addPostFrameCallback((_) => _go());"
          new = "    WidgetsBinding.instance.addPostFrameCallback((_) => _goSafely());"
          if old in s and '_goSafely' not in s:
              s = s.replace(old, new, 1)
              changed.append('the work now runs inside a guard')

          # The real class is _ProcessingPageState. If it is not found, do nothing at
          # all - inserting at the first brace put the code above the imports and Dart
          # refused the whole file.
          name = 'class _ProcessingPageState'
          if '_goSafely' in s and 'Future<void> _goSafely()' not in s and name in s:
              anchor = s.find(name)
              brace = s.find('{', anchor)
              if brace > anchor:
                  guard = '''

            Future<void> _goSafely() async {
              try {
                await _go();
              } catch (_) {
                // a page that cannot be read still has to stop the sound
              } finally {
                Sounds.stopAll();
              }
            }
          '''
                  s = s[:brace+1] + guard + s[brace+1:]
                  changed.append('a guard that always stops the sound')

          p.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

