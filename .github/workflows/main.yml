          s = ex.read_text()
          changed = []

          # 1. the words inside the PDF come first. A missing letter is shown as a box so
          #    the result can be inspected instead of guessed at.
          old = """    final doc = await PdfDocument.openFile(path);
              final tmp = await getTemporaryDirectory();
              final pages = <String>[];"""
          new = """    // The words stored inside the PDF are exact; reading the picture is not.
              final layer = await _fromTextLayer(path, from, to);
              if (layer.length == to - from + 1 && layer.every((p) => p.length > 40)) {
                final out = <String>[];
                for (var i = 0; i < layer.length; i++) {
                  onProgress(i + 1, layer.length, layer[i].length);
                  final n = from + i;
                  out.add(pageNumbers ? 'Page $n.\\n${layer[i]}' : layer[i]);
                }
                return out;
              }

              final doc = await PdfDocument.openFile(path);
              final tmp = await getTemporaryDirectory();
              final pages = <String>[];"""
          if old in s and 'final layer = await _fromTextLayer' not in s:
              s = s.replace(old, new, 1)
              changed.append('text layer first')

          # 2. when there is no text layer, the picture is read by ML Kit. The older
          #    engine answers nothing at all on these pages.
          old2 = """    // The page picture goes straight to the older engine, exactly as drawn.
              // No language check, no second engine, nothing in between.
              return await _visionText(f);"""
          new2 = """    // The picture is read by ML Kit; the older engine answers nothing here.
              return await ocrFile(f, mode);"""
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed.append('ML Kit reads the picture')

          ex.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

      - name: Read the PDF words with an engine written in Dart
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          changed = []

          # ---------- 1. a PDF engine written entirely in Dart: no native code, so it
          # cannot take the file away from the page renderer
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          if 'pdf_graphics' not in s:
              s = s.replace('  pdfx: ^2.9.2', '  pdfx: ^2.9.2\n  pdf_graphics: ^16.0.0\n  pdf_document: ^16.0.0', 1)
              p.write_text(s)
              changed.append('pubspec: pdf_graphics + pdf_document')

          ex = pathlib.Path('lib/extractors.dart')
          s = ex.read_text()

          # both packages have a class named PdfDocument, so each is given a short name
          if 'as pd;' not in s:
              s = s.replace("import 'package:flutter_pdf_text/flutter_pdf_text.dart';",
                            "import 'package:flutter_pdf_text/flutter_pdf_text.dart';\n"
                            "import 'package:pdf_document/pdf_document.dart' as pd;\n"
                            "import 'package:pdf_graphics/pdf_graphics.dart' as pg;", 1)
              changed.append('imports with short names')

          # ---------- 2. the reader itself now uses the Dart-only engine
          old = """  static Future<List<String>> _fromTextLayer(String path, int from, int to) async {
              try {
                final doc = await PDFDoc.fromPath(path);
                final out = <String>[];
                for (var i = from; i <= to; i++) {
                  if (i - 1 >= doc.length) break;
                  final t = _foldMarks(await doc.pages[i - 1].text).trim();
                  out.add(t);
                }
                return out;
              } catch (_) {
                return const [];
              }
            }"""
          new = """  /// Reads the words stored inside the PDF with an engine written in Dart.
            /// No native code takes part, so the page can still be drawn afterwards.
            static Future<List<String>> _fromTextLayer(String path, int from, int to) async {
              try {
                final bytes = await File(path).readAsBytes();
                final doc = pd.PdfDocument.open(bytes);
                final total = doc.pageCount;
                final out = <String>[];
                for (var i = from; i <= to; i++) {
                  if (i - 1 >= total) break;
                  out.add(_foldMarks(pg.PdfTextExtractor.extract(doc, i - 1).text).trim());
                }
                return out;
              } catch (_) {
                return const [];
              }
            }"""
          if old in s:
              s = s.replace(old, new, 1)
              changed.append('reader uses the Dart engine')

          ex.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

      - name: Take the old Java PDF reader out of the build
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          changed = []

          # ---------- the Java PDF reader is no longer called anywhere: the Dart engine
          # does that work now. Taking it out also takes about nine megabytes of PdfBox
          # out of the phone build.
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          before = s
          s = '\n'.join(l for l in s.split('\n') if 'flutter_pdf_text' not in l)
          if s != before:
              p.write_text(s)
              changed.append('pubspec: flutter_pdf_text removed')

          ex = pathlib.Path('lib/extractors.dart')
          s = ex.read_text()
          before = s
          s = '\n'.join(l for l in s.split('\n')
                        if "package:flutter_pdf_text/flutter_pdf_text.dart" not in l)
          if s != before:
              ex.write_text(s)
              changed.append('import removed')

          # nothing may still call the old reader
          left = ex.read_text().count('PDFDoc')
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          print('PDFDoc references left:', left)
          PY
          python3 /tmp/p.py

      - name: Build the APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Put the phone APK where it can be downloaded directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk voiceleaf.apk
          gh release create latest voiceleaf.apk \
            --title "Voiceleaf latest" \
            --notes "Built from the newest commit. Download voiceleaf.apk and install it." \
            --latest || gh release upload latest voiceleaf.apk --clobber

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
