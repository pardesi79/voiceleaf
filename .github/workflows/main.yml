name: Build Voiceleaf APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack the project from voiceleaf-src.zip
        run: |
          mkdir -p app
          unzip -o voiceleaf-src.zip -d app
          ls -la app

      - name: Create the Android shell
        working-directory: app
        run: flutter create --org com.voiceleaf --project-name voiceleaf .

      - name: Set permissions, camera, TTS and the app name
        working-directory: app
        run: python3 tool/patch_android.py

      - name: Keep the audio recorder on a matching interface version
        working-directory: app
        run: |
          grep -q "dependency_overrides" pubspec.yaml || printf '\ndependency_overrides:\n  record_platform_interface: 1.5.0\n' >> pubspec.yaml
          tail -4 pubspec.yaml

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      - name: Build the APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
