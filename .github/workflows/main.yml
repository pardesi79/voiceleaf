      - name: Read pages with the new engine
        run: |
          cat > android/app/src/main/kotlin/com/voiceleaf/voiceleaf/PaddleOcr.kt <<'KT'
          package com.voiceleaf.voiceleaf

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import java.io.File
          import java.nio.FloatBuffer
          import java.util.Collections

          /**
           * Offline text recognition with PaddleOCR models, running on ONNX Runtime.
           * Detection finds the text lines, recognition reads each line on its own.
           */
          object PaddleOcr {

              private var env: OrtEnvironment? = null
              private var det: OrtSession? = null
              private var rec: OrtSession? = null
              private var quad: OrtSession? = null
              private var dict: List<String> = emptyList()
              private var loaded = false
              private var lastError = ""

              private const val DET_MAX_SIDE = 1536
              private const val DB_THRESH = 0.2f
              private const val BOX_THRESH = 0.3f
              private const val MIN_SIDE = 3
              private const val REC_H = 48
              private const val REC_MAX_W = 1024

              fun status(ctx: Context): String {
                  if (load(ctx)) {
                      return "ready. det+rec loaded, ${dict.size} characters"
                  }
                  return "failed: $lastError"
              }

              private fun load(ctx: Context): Boolean {
                  if (loaded) return true
                  return try {
                      val e = OrtEnvironment.getEnvironment()
                      env = e
                      val opts = OrtSession.SessionOptions()
                      det = e.createSession(ctx.assets.open("flutter_assets/assets/ocr/det.ort").readBytes(), opts)
                      rec = e.createSession(ctx.assets.open("flutter_assets/assets/ocr/devanagari.ort").readBytes(), opts)
                      dict = ctx.assets.open("flutter_assets/assets/ocr/devanagari_dict.txt")
                          .bufferedReader().readLines().filter { it.isNotEmpty() }
                      quad = try {
                          e.createSession(ctx.assets.open("flutter_assets/assets/ocr/docquad.ort").readBytes(), opts)
                      } catch (t: Throwable) {
                          null
                      }
                      loaded = true
                      true
                  } catch (t: Throwable) {
                      lastError = "${t.javaClass.simpleName}: ${t.message}"
                      false
                  }
              }

              fun readFile(ctx: Context, path: String, prep: Boolean): String {
                  if (!load(ctx)) return "failed: $lastError"
                  val bmp = loadBitmap(path) ?: return "failed: cannot open image"
                  // Only camera photos need straightening and trimming. A page that came
                  // out of a PDF is already flat and must be left alone.
                  val ready = if (prep) autoCrop(warpPage(bmp)) else bmp
                  return readBitmap(ctx, ready)
              }

              /** Opens a photo the right way up, using the rotation stored in the file. */
              private fun loadBitmap(path: String): Bitmap? {
                  val bmp = BitmapFactory.decodeFile(path) ?: return null
                  val deg = try {
                      val ex = android.media.ExifInterface(path)
                      when (ex.getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1)) {
                          android.media.ExifInterface.ORIENTATION_ROTATE_90 -> 90
                          android.media.ExifInterface.ORIENTATION_ROTATE_180 -> 180
                          android.media.ExifInterface.ORIENTATION_ROTATE_270 -> 270
                          else -> 0
                      }
                  } catch (t: Throwable) {
                      0
                  }
                  if (deg == 0) return bmp
                  val m = android.graphics.Matrix()
                  m.postRotate(deg.toFloat())
                  return Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
              }

              private fun dist(p: FloatArray, a: Int, b: Int): Float {
                  val dx = p[a * 2] - p[b * 2]
                  val dy = p[a * 2 + 1] - p[b * 2 + 1]
                  return kotlin.math.sqrt(dx * dx + dy * dy)
              }

              /** Finds the four corners of the page and straightens it. Falls back to the
               *  photo as it is when the model is not sure. */
              private fun warpPage(src: Bitmap): Bitmap {
                  val s = quad ?: return src
                  val e = env ?: return src
                  return try {
                      val scale = minOf(256f / src.width, 256f / src.height)
                      val nw = (src.width * scale).toInt().coerceAtLeast(1)
                      val nh = (src.height * scale).toInt().coerceAtLeast(1)
                      val ox = (256 - nw) / 2
                      val oy = (256 - nh) / 2
                      val canvas = Bitmap.createBitmap(256, 256, Bitmap.Config.ARGB_8888)
                      val c = android.graphics.Canvas(canvas)
                      c.drawColor(android.graphics.Color.BLACK)
                      c.drawBitmap(
                          src, null, android.graphics.Rect(ox, oy, ox + nw, oy + nh),
                          android.graphics.Paint(android.graphics.Paint.FILTER_BITMAP_FLAG)
                      )
                      val px = IntArray(256 * 256)
                      canvas.getPixels(px, 0, 256, 0, 0, 256, 256)
                      val data = FloatArray(3 * 256 * 256)
                      for (i in 0 until 256 * 256) {
                          val p = px[i]
                          data[i] = ((p shr 16) and 0xFF) / 255f
                          data[256 * 256 + i] = ((p shr 8) and 0xFF) / 255f
                          data[2 * 256 * 256 + i] = (p and 0xFF) / 255f
                      }
                      OnnxTensor.createTensor(e, FloatBuffer.wrap(data), longArrayOf(1, 3, 256, 256)).use { t ->
                          s.run(Collections.singletonMap("input", t)).use { out ->
                              val res = out.get("corner_heatmaps").orElse(null) ?: return src
                              val o = res.value
                              if (o !is Array<*>) return src
                              val chans = o[0] as? Array<*> ?: return src
                              val pts = FloatArray(8)
                              for (ci in 0 until 4) {
                                  val grid = chans[ci] as? Array<FloatArray> ?: return src
                                  var bi = 0
                                  var bj = 0
                                  var bv = -1e9f
                                  for (i in 0 until 64) {
                                      val row = grid[i]
                                      for (j in 0 until 64) {
                                          if (row[j] > bv) {
                                              bv = row[j]
                                              bi = i
                                              bj = j
                                          }
                                      }
                                  }
                                  pts[ci * 2] = ((bj + 0.5f) * 4f - ox) / scale
                                  pts[ci * 2 + 1] = ((bi + 0.5f) * 4f - oy) / scale
                              }
                              val w = maxOf(dist(pts, 0, 1), dist(pts, 3, 2))
                              val h = maxOf(dist(pts, 0, 3), dist(pts, 1, 2))
                              if (w < src.width * 0.25f || h < src.height * 0.25f) return src
                              val dst = floatArrayOf(0f, 0f, w, 0f, w, h, 0f, h)
                              val m = android.graphics.Matrix()
                              if (!m.setPolyToPoly(pts, 0, dst, 0, 4)) return src
                              Bitmap.createBitmap(src, 0, 0, src.width, src.height, m, true)
                          }
                      }
                  } catch (t: Throwable) {
                      src
                  }
              }

              /** Cuts away the table, the desk or the dark background around the page. */
              private fun autoCrop(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  if (w < 32 || h < 32) return src
                  val px = IntArray(w * h)
                  src.getPixels(px, 0, w, 0, 0, w, h)
                  fun lum(i: Int): Int {
                      val p = px[i]
                      return (((p shr 16) and 0xFF) * 299 + ((p shr 8) and 0xFF) * 587 + (p and 0xFF) * 114) / 1000
                  }
                  val corners = intArrayOf(lum(0), lum(w - 1), lum((h - 1) * w), lum(w * h - 1))
                  corners.sort()
                  val bg = corners[1]
                  val tol = 28
                  val step = maxOf(1, minOf(w, h) / 200)
                  var minX = w
                  var minY = h
                  var maxX = -1
                  var maxY = -1
                  var y = 0
                  while (y < h) {
                      var x = 0
                      while (x < w) {
                          if (kotlin.math.abs(lum(y * w + x) - bg) > tol) {
                              if (x < minX) minX = x
                              if (x > maxX) maxX = x
                              if (y < minY) minY = y
                              if (y > maxY) maxY = y
                          }
                          x += step
                      }
                      y += step
                  }
                  if (maxX <= minX || maxY <= minY) return src
                  val m = maxOf(4, minOf(w, h) / 100)
                  val l = maxOf(0, minX - m)
                  val t = maxOf(0, minY - m)
                  val r = minOf(w, maxX + m)
                  val b = minOf(h, maxY + m)
                  if ((r - l) < w * 0.3 || (b - t) < h * 0.3) return src
                  return Bitmap.createBitmap(src, l, t, r - l, b - t)
              }

              fun readBitmap(ctx: Context, src: Bitmap): String {
                  if (!load(ctx)) return "failed: $lastError"
                  val boxes = detect(src)
                  if (boxes.isEmpty()) return ""
                  val lines = ArrayList<String>()
                  for (b in boxes) {
                      val text = recognise(src, b)
                      if (text.isNotEmpty()) lines.add(text)
                  }
                  return lines.joinToString("\n")
              }

              // ---------- detection ----------
              private class Box(val l: Int, val t: Int, val r: Int, val b: Int)

              private fun detect(src: Bitmap): List<Box> {
                  val w0 = src.width
                  val h0 = src.height
                  val scale = minOf(DET_MAX_SIDE.toFloat() / maxOf(w0, h0), 1f)
                  val nw = maxOf(32, (w0 * scale).toInt() / 32 * 32)
                  val nh = maxOf(32, (h0 * scale).toInt() / 32 * 32)
                  val small = Bitmap.createScaledBitmap(src, nw, nh, true)

                  val px = IntArray(nw * nh)
                  small.getPixels(px, 0, nw, 0, 0, nw, nh)

                  val data = FloatArray(3 * nw * nh)
                  val mean = floatArrayOf(0.406f * 255f, 0.456f * 255f, 0.485f * 255f)
                  val std = floatArrayOf(0.225f * 255f, 0.224f * 255f, 0.229f * 255f)
                  for (i in 0 until nw * nh) {
                      val p = px[i]
                      val b = (p and 0xFF).toFloat()
                      val g = ((p shr 8) and 0xFF).toFloat()
                      val r = ((p shr 16) and 0xFF).toFloat()
                      data[i] = (b - mean[0]) / std[0]
                      data[nw * nh + i] = (g - mean[1]) / std[1]
                      data[2 * nw * nh + i] = (r - mean[2]) / std[2]
                  }

                  val e = env ?: return emptyList()
                  val s = det ?: return emptyList()
                  val name = s.inputNames.first()
                  OnnxTensor.createTensor(e, FloatBuffer.wrap(data), longArrayOf(1, 3, nh.toLong(), nw.toLong())).use { t ->
                      s.run(Collections.singletonMap(name, t)).use { out ->
                          val o = out.get(0).value
                          if (o !is Array<*>) return emptyList()
                          val channel = o[0] as? Array<*> ?: return emptyList()
                          val map = channel[0] as? Array<FloatArray> ?: return emptyList()
                          return boxesFrom(map, nw, nh, w0.toFloat() / nw, h0.toFloat() / nh)
                      }
                  }
              }

              private fun boxesFrom(map: Array<FloatArray>, w: Int, h: Int, sx: Float, sy: Float): List<Box> {
                  val seen = BooleanArray(w * h)
                  val out = ArrayList<Box>()
                  val stack = IntArray(w * h)
                  for (start in 0 until w * h) {
                      if (seen[start]) continue
                      val y0 = start / w
                      val x0 = start % w
                      if (map[y0][x0] <= DB_THRESH) { seen[start] = true; continue }
                      var sp = 0
                      stack[sp++] = start
                      seen[start] = true
                      var minX = x0; var maxX = x0; var minY = y0; var maxY = y0
                      var sum = 0f; var count = 0
                      while (sp > 0) {
                          val cur = stack[--sp]
                          val cy = cur / w
                          val cx = cur % w
                          sum += map[cy][cx]; count++
                          if (cx < minX) minX = cx
                          if (cx > maxX) maxX = cx
                          if (cy < minY) minY = cy
                          if (cy > maxY) maxY = cy
                          for (dy in -1..1) for (dx in -1..1) {
                              val nx = cx + dx
                              val ny = cy + dy
                              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue
                              val ni = ny * w + nx
                              if (seen[ni]) continue
                              if (map[ny][nx] <= DB_THRESH) { seen[ni] = true; continue }
                              seen[ni] = true
                              stack[sp++] = ni
                          }
                      }
                      val bw = maxX - minX + 1
                      val bh = maxY - minY + 1
                      if (bw < MIN_SIDE || bh < MIN_SIDE) continue
                      if (count == 0 || sum / count < BOX_THRESH) continue
                      val padX = maxOf(2, (bw * 0.08f).toInt())
                      val padY = maxOf(2, (bh * 0.12f).toInt())
                      out.add(
                          Box(
                              maxOf(0, ((minX - padX) * sx).toInt()),
                              maxOf(0, ((minY - padY) * sy).toInt()),
                              minOf((w * sx).toInt(), ((maxX + padX) * sx).toInt()),
                              minOf((h * sy).toInt(), ((maxY + padY) * sy).toInt())
                          )
                      )
                  }
                  out.sortWith(compareBy({ it.t / 12 }, { it.l }))
                  return out
              }

              // ---------- recognition ----------
              private fun recognise(src: Bitmap, b: Box): String {
                  val cw = maxOf(1, b.r - b.l)
                  val ch = maxOf(1, b.b - b.t)
                  val crop = Bitmap.createBitmap(src, b.l, b.t, minOf(cw, src.width - b.l), minOf(ch, src.height - b.t))
                  var w = (REC_H * cw.toFloat() / ch).toInt()
                  if (w < 8) w = 8
                  if (w > REC_MAX_W) w = REC_MAX_W
                  val rs = Bitmap.createScaledBitmap(crop, w, REC_H, true)
                  val px = IntArray(w * REC_H)
                  rs.getPixels(px, 0, w, 0, 0, w, REC_H)

                  val data = FloatArray(3 * w * REC_H)
                  for (i in 0 until w * REC_H) {
                      val p = px[i]
                      data[i] = ((p and 0xFF) / 255f - 0.5f) / 0.5f
                      data[w * REC_H + i] = (((p shr 8) and 0xFF) / 255f - 0.5f) / 0.5f
                      data[2 * w * REC_H + i] = (((p shr 16) and 0xFF) / 255f - 0.5f) / 0.5f
                  }

                  val e = env ?: return ""
                  val s = rec ?: return ""
                  val name = s.inputNames.first()
                  OnnxTensor.createTensor(e, FloatBuffer.wrap(data), longArrayOf(1, 3, REC_H.toLong(), w.toLong())).use { t ->
                      s.run(Collections.singletonMap(name, t)).use { out ->
                          val o = out.get(0).value
                          if (o !is Array<*>) return ""
                          val seq = o[0] as? Array<FloatArray> ?: return ""
                          return decode(seq)
                      }
                  }
              }

              private fun decode(seq: Array<FloatArray>): String {
                  val sb = StringBuilder()
                  var prev = -1
                  for (step in seq) {
                      var best = 0
                      var bestV = step[0]
                      for (i in 1 until step.size) {
                          if (step[i] > bestV) { bestV = step[i]; best = i }
                      }
                      if (best != 0 && best != prev) {
                          val idx = best - 1
                          if (idx >= 0 && idx < dict.size) sb.append(dict[idx])
                      }
                      prev = best
                  }
                  return sb.toString().trim()
              }
          }
          KT
