      - name: Never let a sound outlive its screen
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          changed = []

          # The loop had no way out except dispose(), so it played forever and held the
          # audio session - which is why the reading voice and every player button went
          # dead. Give it a watchdog, and a stop that works from anywhere.
          w = pathlib.Path('lib/widgets.dart')
          s = w.read_text()

          if 'static Timer? _watchdog;' not in s:
              old_loop = "  static Future<void> loop(String name) async {"
              new_loop = """  static Timer? _watchdog;

            static Future<void> loop(String name) async {"""
              if old_loop in s:
                  s = s.replace(old_loop, new_loop, 1)
                  changed.append('the loop gets a watchdog field')

          if 'Timer(const Duration(seconds: 90)' not in s:
              # anchor on the end of loop(), whatever the play line looks like by now
              i = s.find('static Future<void> loop(String name) async {')
              if i > 0:
                  j = s.find('\n  }', i)
                  if j > i:
                      ins = """
                // a loop with no end is a bug, so it ends itself
                _watchdog?.cancel();
                _watchdog = Timer(const Duration(seconds: 90), () {
                  stopAll();
                });"""
                      s = s[:j] + ins + s[j:]
                      changed.append('the loop stops itself after 90 seconds')

          if 'static Future<void> stopAll()' not in s:
              old_stop = """  static Future<void> stopLoop() async {
              try {
                await _loop.stop();
              } catch (_) {}
            }"""
              new_stop = """  static Future<void> stopLoop() async {
              _watchdog?.cancel();
              _watchdog = null;
              try {
                await _loop.stop();
              } catch (_) {}
            }

            /// Silence everything. Safe to call from anywhere, at any time.
            static Future<void> stopAll() async {
              _watchdog?.cancel();
              _watchdog = null;
              try {
                await _loop.stop();
                await _one.stop();
                await _loop.setReleaseMode(ReleaseMode.release);
              } catch (_) {}
            }"""
              if old_stop in s:
                  s = s.replace(old_stop, new_stop, 1)
                  changed.append('a stopAll that silences both players')

          if "import 'dart:async';" not in s:
              s = "import 'dart:async';\n" + s
              changed.append('the timer import')

          w.write_text(s)

          # leaving the app must never leave a sound running
          m = pathlib.Path('lib/main.dart')
          t = m.read_text()
          if 'didChangeAppLifecycleState' not in t:
              anchor = "class VoiceleafApp extends StatelessWidget {"
              obs = """class _SilenceOnLeave extends WidgetsBindingObserver {
            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state != AppLifecycleState.resumed) {
                Sounds.stopAll();
              }
            }
          }

          final _silenceOnLeave = _SilenceOnLeave();

          """
              if anchor in t:
                  t = t.replace(anchor, obs + anchor, 1)
                  old = "  WidgetsFlutterBinding.ensureInitialized();"
                  if old in t:
                      t = t.replace(old, old + "\n  WidgetsBinding.instance.addObserver(_silenceOnLeave);", 1)
                      changed.append('leaving the app silences every sound')
              m.write_text(t)

          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py
      - name: Make the speech declare itself as media
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          p = pathlib.Path('lib/player_page.dart')
          s = p.read_text()
          changed = []

          anchor = "    // no stop() here: on some engines it cancels the speak that follows"
          if anchor in s and 'setAudioAttributesForNavigation' not in s:
              add = """    // declare the speech as media, so it rides the volume the reader expects
              try {
                await tts.setAudioAttributesForNavigation();
              } catch (_) {}
              try {
                await tts.setVolume(1.0);
              } catch (_) {}
              try {
                await tts.setQueueMode(1);
              } catch (_) {}
          """
              s = s.replace(anchor, add + anchor, 1)
              changed.append('speech declares itself as media, at full volume, queued')

          p.write_text(s)
          print('CHANGED:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/p.py

      - name: Build the APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Put the phone APK where it can be downloaded directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk voiceleaf.apk
          gh release create latest voiceleaf.apk \
            --title "Voiceleaf latest" \
            --notes "Built from the newest commit. Download voiceleaf.apk and install it." \
            --latest || gh release upload latest voiceleaf.apk --clobber

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
