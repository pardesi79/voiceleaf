      run: "cat > /tmp/patch_pdfrx.py <<'PY'\nimport pathlib\n\nchanged = []\n\n# 1. swap the PDF library\np = pathlib.Path('pubspec.yaml')\ns = p.read_text()\nif 'pdfx:' in s:\n    s = s.replace('  pdfx: ^2.9.2', '  pdfrx: ^2.12.0', 1)\n    s = s.replace('  archive: ^3.6.1', '  archive: ^4.0.9', 1)\n    p.write_text(s)\n    changed.append('pubspec: pdfrx + archive 4')\n\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\n# 2. imports\ns = s.replace(\"import 'package:pdfx/pdfx.dart';\", \"import 'package:pdfrx/pdfrx.dart';\", 1)\nif \"import 'dart:async';\" not in s:\n    s = s.replace(\"import 'dart:convert';\", \"import 'dart:async';\\nimport 'dart:convert';\", 1)\n    changed.append('extractors: async import')\n\n# 3. page count + a helper that turns a rendered page into PNG bytes\nold_count = \"\"\"  static Future<int> pdfPageCount(String path) async {\n    final doc = await PdfDocument.openFile(path);\n    final n = doc.pagesCount;\n    await doc.close();\n    return n;\n  }\"\"\"\nnew_count = \"\"\"  static Future<int> pdfPageCount(String path) async {\n    final doc = await PdfDocument.openFile(path);\n    final n = doc.pages.length;\n    await doc.dispose();\n    return n;\n  }\n\n  /// Turns one rendered page into PNG bytes, which both engines understand.\n  static Future<Uint8List> _pagePng(PdfPage page) async {\n    final img = await page.render(\n      fullWidth: page.width * 2,\n      fullHeight: page.height * 2,\n    );\n    if (img == null) return Uint8List(0);\n    final bgra = img.pixels;\n    final rgba = Uint8List(bgra.length);\n    for (var i = 0; i + 3 < bgra.length; i += 4) {\n      rgba[i] = bgra[i + 2];\n      rgba[i + 1] = bgra[i + 1];\n      rgba[i + 2] = bgra[i];\n      rgba[i + 3] = bgra[i + 3];\n    }\n    final done = Completer<ui.Image>();\n    ui.decodeImageFromPixels(\n        rgba, img.width, img.height, ui.PixelFormat.rgba8888,\n        (image) => done.complete(image));\n    final image = await done.future;\n    final data = await image.toByteData(format: ui.ImageByteFormat.png);\n    return data?.buffer.asUint8List() ?? Uint8List(0);\n  }\"\"\"\nif old_count in s:\n    s = s.replace(old_count, new_count, 1)\n    changed.append('extractors: page count + png')\n\n# 4. the whole pdf() function\nstart = s.index('  static Future<List<String>> pdf(String path, String mode, int from, int to,')\nend = s.index('\\n  }\\n', s.index('    return pages;', start)) + len('\\n  }\\n')\nnew_pdf = '''  static Future<List<String>> pdf(String path, String mode, int from, int to,\n      void Function(int done, int total, int chars) onProgress,\n      {bool pageNumbers = false}) async {\n    final doc = await PdfDocument.openFile(path);\n    final tmp = await getTemporaryDirectory();\n    final pages = <String>[];\n    try {\n      final total = to - from + 1;\n      var empty = 0;\n      for (var i = from; i <= to; i++) {\n        onProgress(i - from + 1, total, -1);\n        final page = doc.pages[i - 1];\n        // A PDF that already carries real text needs no OCR at all: read it\n        // exactly as it is, which is also far quicker.\n        var layer = '';\n        try {\n          layer = (await page.loadText())?.fullText.trim() ?? '';\n        } catch (_) {}\n        if (layer.length > 40) {\n          onProgress(i - from + 1, total, layer.length);\n          pages.addAll(paginate(pageNumbers ? 'Page $i.\\\\n$layer' : layer));\n          continue;\n        }\n        final w = page.width;\n        final h = page.height;\n        final bytes = await _pagePng(page);\n        if (bytes.isEmpty) {\n          empty++;\n          onProgress(i - from + 1, total, -2);\n          continue;\n        }\n        final f = File('${tmp.path}/pg_$i.png');\n        await f.writeAsBytes(bytes);\n        String text;\n        if (w > h) {\n          // A scanned book often shows two pages side by side. Read each half\n          // on its own, otherwise the two pages get mixed together line by line.\n          final codec = await ui.instantiateImageCodec(bytes);\n          final frame = await codec.getNextFrame();\n          final full = frame.image;\n          final half = full.width ~/ 2;\n          final lb = await _cropHalf(full, 0, half);\n          final rb = await _cropHalf(full, half, full.width - half);\n          final lf = File('${tmp.path}/pg_${i}_l.png');\n          final rf = File('${tmp.path}/pg_${i}_r.png');\n          await lf.writeAsBytes(lb);\n          await rf.writeAsBytes(rb);\n          final lt = await _pageText(lf, mode);\n          final rt = await _pageText(rf, mode);\n          await lf.delete();\n          await rf.delete();\n          text = '$lt\\\\n$rt';\n        } else {\n          text = await _pageText(f, mode);\n        }\n        await f.delete();\n        onProgress(i - from + 1, total, text.trim().length);\n        if (text.trim().isEmpty) {\n          empty++;\n        } else {\n          pages.addAll(paginate(pageNumbers ? 'Page $i.\\\\n$text' : text));\n        }\n      }\n      if (pages.isEmpty) {\n        throw Exception(\n            'No text was found in this PDF. $empty page(s) were read but '\n            'came back empty. Try Take Photo instead, or set the text '\n            'recognition language in Preferences.');\n      }\n    } finally {\n      await doc.dispose();\n    }\n    return pages;\n  }\n'''\ns = s[:start] + new_pdf + s[end:]\nchanged.append('extractors: pdf rewritten for pdfrx')\nex.write_text(s)\n\n# archive v4 returns a plain list, so the old null-assert is no longer needed\nex2 = pathlib.Path('lib/exporter.dart')\ns2 = ex2.read_text()\nif 'ZipEncoder().encode(arc)!' in s2:\n    s2 = s2.replace('ZipEncoder().encode(arc)!', 'ZipEncoder().encode(arc)')\n    ex2.write_text(s2)\n    changed.append('exporter: archive v4')\n\n\n# archive v4 replaced the true/false flag with a compression type\nex3 = pathlib.Path('lib/exporter.dart')\ns3 = ex3.read_text()\nif 'f.compress = compress;' in s3:\n    s3 = s3.replace('    f.compress = compress;',\n                    '    f.compression = compress ? CompressionType.deflate : CompressionType.none;')\n    ex3.write_text(s3)\n    changed.append('exporter: compression type')\n\nprint('patched:', ', '.join(changed))\nPY\npython3 /tmp/patch_pdfrx.py\n"
    - name: Choose the right script fairly in auto mode
      run: "cat > /tmp/patch_autolang.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\n# 1. score each result by characters of its own script\nold_letters = \"\"\"  static int _letters(String t) {\n    var n = 0;\n    for (final r in t.runes) {\n      if (r > 32) n++;\n    }\n    return n;\n  }\"\"\"\nnew_letters = \"\"\"  static int _letters(String t) {\n    var n = 0;\n    for (final r in t.runes) {\n      if (r > 32) n++;\n    }\n    return n;\n  }\n\n  /// Counts how many characters of the expected script a result really has.\n  /// Comparing raw length is unfair: a Latin pass over a Hindi page returns a\n  /// lot of junk that is longer than the correct Devanagari text.\n  static int _scriptScore(String t, bool devanagari) {\n    var n = 0;\n    for (final r in t.runes) {\n      if (devanagari) {\n        if (r >= 0x0900 && r <= 0x097F) n++;\n      } else {\n        if ((r >= 0x41 && r <= 0x5A) || (r >= 0x61 && r <= 0x7A)) n++;\n      }\n    }\n    return n;\n  }\"\"\"\nif old_letters in s:\n    s = s.replace(old_letters, new_letters, 1)\n    changed.append('extractors: script score')\n\n# 2. use that score when both passes run\nold_auto = \"\"\"    var best = await run('latin');\n    var bestLen = _letters(best);\n    final dev = await run('devanagari');\n    if (_letters(dev) > bestLen) {\n      best = dev;\n      bestLen = _letters(dev);\n    }\"\"\"\nnew_auto = \"\"\"    var best = await run('latin');\n    var bestLen = _scriptScore(best, false);\n    final dev = await run('devanagari');\n    final devScore = _scriptScore(dev, true);\n    if (devScore > bestLen) {\n      best = dev;\n      bestLen = devScore;\n    }\"\"\"\nif old_auto in s:\n    s = s.replace(old_auto, new_auto, 1)\n    changed.append('extractors: fair auto compare')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_autolang.py\n"
    - name: Keep PDF words together
      run: "cat > /tmp/patch_tidypdf.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\n# 1. a helper that rebuilds readable lines from the raw characters\nanchor = \"  /// Turns one rendered page into PNG bytes, which both engines understand.\"\nhelper = '''  /// Puts the broken lines back together, keeping the characters in the order\n  /// the PDF gives them. Reordering by position breaks Devanagari, because a\n  /// matra has to stay with its letter.\n  static String _tidyLayer(PdfPageRawText t) {\n    final lines = t.fullText.split('\\\\n');\n    final out = <String>[];\n    var buf = StringBuffer();\n    for (final line in lines) {\n      final s = line.trim();\n      if (s.isEmpty) {\n        if (buf.isNotEmpty) {\n          out.add(buf.toString());\n          buf = StringBuffer();\n        }\n        continue;\n      }\n      if (buf.isNotEmpty) buf.write(' ');\n      buf.write(s);\n      if (RegExp(r'[.!?\\\\u0964][\"\\\\u201D\\\\u2019]?$').hasMatch(s)) {\n        out.add(buf.toString());\n        buf = StringBuffer();\n      }\n    }\n    if (buf.isNotEmpty) out.add(buf.toString());\n    return out.join('\\\\n');\n  }\n\n'''\nif '_tidyLayer' not in s and anchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('extractors: tidy layer helper')\n\n# 2. use it instead of the raw dump\nold = \"\"\"        var layer = '';\n        try {\n          layer = (await page.loadText())?.fullText.trim() ?? '';\n        } catch (_) {}\"\"\"\nnew = \"\"\"        var layer = '';\n        try {\n          final raw = await page.loadText();\n          layer = raw == null ? '' : _tidyLayer(raw);\n        } catch (_) {}\"\"\"\nif old in s:\n    s = s.replace(old, new, 1)\n    changed.append('extractors: use tidy text')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_tidypdf.py\n"
    - name: Read the page with OCR first
      run: "cat > /tmp/patch_ocrfirst.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\n# OCR first again: the text inside a PDF can have correct letters but broken\n# spacing, and the reading voice sounds choppy. Only when OCR finds almost\n# nothing do we fall back to the PDF's own text.\nold_skip = \"\"\"        if (layer.length > 40) {\n          onProgress(i - from + 1, total, layer.length);\n          pages.addAll(paginate(pageNumbers ? 'Page $i.\\\\n$layer' : layer));\n          continue;\n        }\n\"\"\"\nif old_skip in s:\n    s = s.replace(old_skip, \"\", 1)\n    changed.append('extractors: always read the page')\n\nold_after = \"\"\"        await f.delete();\n        onProgress(i - from + 1, total, text.trim().length);\"\"\"\nnew_after = \"\"\"        await f.delete();\n        if (text.trim().length < 40 && layer.isNotEmpty) text = layer;\n        onProgress(i - from + 1, total, text.trim().length);\"\"\"\nif old_after in s:\n    s = s.replace(old_after, new_after, 1)\n    changed.append('extractors: text layer as fallback')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_ocrfirst.py\n"
    - name: Make the reading flow like a book
      run: "cat > /tmp/patch_flow.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\nstart = s.index('List<String> paginate(String raw, {int maxLen = 1800}) {')\nend = s.index('\\n}', s.index('  return pages;', start)) + len('\\n}')\n\nnew = '''List<String> paginate(String raw, {int maxLen = 1800}) {\n  final text = raw\n      .replaceAll('\\\\r', '')\n      .replaceAll(RegExp(r'[ \\\\t]+'), ' ')\n      .trim();\n  if (text.isEmpty) return [];\n  // Put the broken lines back into flowing sentences. Only a real sentence end\n  // starts a new piece, so the reading voice does not stop after every line.\n  final pieces = <String>[];\n  var buf = StringBuffer();\n  for (final line in text.split('\\\\n')) {\n    final t = line.trim();\n    if (t.isEmpty) {\n      if (buf.isNotEmpty) {\n        pieces.add(buf.toString());\n        buf = StringBuffer();\n      }\n      continue;\n    }\n    if (buf.isNotEmpty) buf.write(' ');\n    buf.write(t);\n    if (RegExp(r'[.!?\\\\u0964][\"\\\\u201D\\\\u2019]?$').hasMatch(t)) {\n      pieces.add(buf.toString());\n      buf = StringBuffer();\n    }\n  }\n  if (buf.isNotEmpty) pieces.add(buf.toString());\n\n  final pages = <String>[];\n  var out = StringBuffer();\n  for (var p in pieces) {\n    while (p.length > maxLen) {\n      var cut = p.lastIndexOf(RegExp(r'[.!?\\\\u0964]\\\\s'), maxLen);\n      if (cut <= 0) cut = p.lastIndexOf(' ', maxLen);\n      cut = cut <= 0 ? maxLen : cut + 1;\n      final head = p.substring(0, cut).trim();\n      if (head.isNotEmpty) {\n        if (out.length > 0) {\n          pages.add(out.toString().trim());\n          out = StringBuffer();\n        }\n        pages.add(head);\n      }\n      p = p.substring(cut).trim();\n    }\n    if (p.isEmpty) continue;\n    if (out.length > 0 && out.length + p.length > maxLen) {\n      pages.add(out.toString().trim());\n      out = StringBuffer();\n    }\n    out.writeln(p);\n  }\n  if (out.length > 0) pages.add(out.toString().trim());\n  return pages;\n}'''\n\ns = s[:start] + new + s[end:]\nex.write_text(s)\nchanged.append('extractors: flowing text')\nprint('patched:', ', '.join(changed))\nPY\npython3 /tmp/patch_flow.py\n"
    - name: Repair Hindi words after reading
      run: "cat > /tmp/patch_indic.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\nhelper = '''/// Small repairs that Indian scripts need after OCR or text extraction.\n/// A vowel mark that got separated from its letter, a word broken by a hyphen\n/// at the end of a line, and stray bars used instead of a Hindi full stop.\nString repairIndic(String input) {\n  var t = input;\n  // a word split across lines: \"पुस्त-\" then \"क\"\n  t = t.replaceAll(RegExp(r'[-\\\\u2010\\\\u2011]\\\\s*\\\\n\\\\s*'), '');\n  // a vowel mark or virama that lost its letter: \"पु स्तक\" -> \"पुस्तक\"\n  t = t.replaceAllMapped(\n      RegExp(r'([\\\\u0900-\\\\u097F])\\\\s+([\\\\u093E-\\\\u094D\\\\u0902\\\\u0903])'),\n      (m) => '${m[1]}${m[2]}');\n  // a bar instead of the Hindi full stop\n  t = t.replaceAll(RegExp(r'\\\\|\\\\|\\\\|'), '\\\\u0965');\n  t = t.replaceAll(RegExp(r'\\\\|'), '\\\\u0964');\n  t = t.replaceAll(RegExp(r'\\\\u0964{3,}'), '\\\\u0965');\n  // leftover double spaces\n  t = t.replaceAll(RegExp(r'[ \\\\t]{2,}'), ' ');\n  return t;\n}\n\n'''\n\nanchor = 'List<String> paginate(String raw, {int maxLen = 1800}) {'\nif 'repairIndic' not in s and anchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('extractors: repairIndic helper')\n\nold = \"\"\"  final text = raw\n      .replaceAll('\\\\r', '')\n      .replaceAll(RegExp(r'[ \\\\t]+'), ' ')\n      .trim();\"\"\"\nnew = \"\"\"  final text = repairIndic(raw\n      .replaceAll('\\\\r', '')\n      .replaceAll(RegExp(r'[ \\\\t]+'), ' '))\n      .trim();\"\"\"\nif old in s:\n    s = s.replace(old, new, 1)\n    changed.append('extractors: paginate uses repair')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_indic.py\n"
    - name: Pause must really pause
      run: "cat > /tmp/patch_fixes.py <<'PY'\nimport pathlib\n\nchanged = []\npp = pathlib.Path('lib/player_page.dart')\np = pp.read_text()\n\n# Pause: some engines ignore the first stop, so ask twice with a small gap.\nold_pause = \"\"\"  Future<void> _pause() async {\n    setState(() => playing = false);\n    await tts.stop();\n    _save();\n  }\"\"\"\nnew_pause = \"\"\"  Future<void> _pause() async {\n    setState(() => playing = false);\n    try {\n      await tts.stop();\n      await Future<void>.delayed(const Duration(milliseconds: 150));\n      await tts.stop();\n    } catch (_) {}\n    _save();\n  }\"\"\"\nif old_pause in p:\n    p = p.replace(old_pause, new_pause, 1)\n    changed.append('player: pause asks twice')\n\n# A sentence that ends while we are paused must not start the next one.\nold_done = \"\"\"  void _onDone() {\n    if (!playing || !mounted) return;\"\"\"\nnew_done = \"\"\"  void _onDone() {\n    if (!playing || !mounted) return;\n    if (_pausedByUser) return;\"\"\"\nif old_done in p and '_pausedByUser' not in p:\n    p = p.replace(old_done, new_done, 1)\n    p = p.replace('  bool playing = false;',\n                  '  bool playing = false;\\n  bool _pausedByUser = false;', 1)\n    p = p.replace(\"\"\"  Future<void> _pause() async {\n    setState(() => playing = false);\"\"\",\n                  \"\"\"  Future<void> _pause() async {\n    setState(() => playing = false);\n    _pausedByUser = true;\"\"\", 1)\n    p = p.replace(\"\"\"    setState(() {\n      cur = start;\n      curEnd = start;\n      playing = true;\n    });\"\"\",\n                  \"\"\"    _pausedByUser = false;\n    setState(() {\n      cur = start;\n      curEnd = start;\n      playing = true;\n    });\"\"\", 1)\n    changed.append('player: pause flag')\n\npp.write_text(p)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_fixes.py\n"
