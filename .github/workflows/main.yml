      - name: Ask the phone spell checker about a few words
        run: |
          cat > /tmp/p.py <<'PY'
          import pathlib

          kt = None
          for p in pathlib.Path('android/app/src/main').rglob('MainActivity.kt'):
              kt = p
          t = kt.read_text()

          bridge = '''
                  // Asks the phone's own spell checker about a few words. It is the same
                  // dictionary the keyboard uses, and the system keeps it up to date.
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "voiceleaf/spell")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "probe") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val words = call.argument<List<String>>("words") ?: emptyList()
                          if (words.isEmpty()) {
                              result.success("NOWORDS")
                              return@setMethodCallHandler
                          }
                          val sb = StringBuilder()
                          var session: android.view.textservice.SpellCheckerSession? = null
                          var answered = false
                          try {
                              val tsm = applicationContext
                                  .getSystemService(android.content.Context.TEXT_SERVICES_MANAGER_SERVICE)
                                      as android.view.textservice.TextServicesManager
                              val locale = java.util.Locale("hi", "IN")
                              val listener =
                                  object : android.view.textservice.SpellCheckerSession
                                      .SpellCheckerSessionListener {
                                      override fun onGetSuggestions(
                                          results: Array<out android.view.textservice.SuggestionsInfo>?
                                      ) {
                                          if (results != null) {
                                              for (r in results) {
                                                  val n = r.suggestionsCount
                                                  val word = if (n > 0) r.getSuggestion(0) else ""
                                                  sb.append(r.suggestionsAttributes).append("|")
                                                      .append(n).append("|").append(word).append(";")
                                              }
                                          }
                                      }

                                      override fun onGetSentenceSuggestions(
                                          results: Array<out android.view.textservice.SentenceSuggestionsInfo>?
                                      ) {}
                                  }
                              session = tsm.newSpellCheckerSession(null, locale, listener, true)
                              if (session == null) {
                                  result.success("NOSERVICE")
                                  return@setMethodCallHandler
                              }
                              for (w in words) {
                                  session.getSuggestions(
                                      android.view.textservice.TextInfo(w), 3)
                              }
                              // the checker answers on another thread, so wait a moment
                              var waited = 0
                              while (waited < 40 && sb.length == 0) {
                                  Thread.sleep(100)
                                  waited++
                              }
                              if (!answered) {
                                  answered = true
                                  result.success(if (sb.isEmpty) "NOSUGGESTIONS" else sb.toString())
                              }
                          } catch (e: Throwable) {
                              if (!answered) {
                                  answered = true
                                  result.success("ERR " + e.javaClass.simpleName + ": " + e.message)
                              }
                          } finally {
                              try { session?.close() } catch (_: Throwable) {}
                          }
                      }
          '''
