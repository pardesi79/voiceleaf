          import pathlib, re

          ex = pathlib.Path('lib/extractors.dart')
          s = ex.read_text()
          before = s

          def drop_function(src, header):
              """Removes a top level or static function together with its doc comment."""
              i = src.find(header)
              if i < 0:
                  return src, False
              # walk back over the comment block that belongs to it
              start = i
              lines = src[:i].split('\n')
              k = len(lines) - 1
              while k > 0 and (lines[k-1].strip().startswith('///') or lines[k-1].strip() == ''):
                  k -= 1
              start = len('\n'.join(lines[:k]))
              if start > 0 and src[start] == '\n':
                  start += 1
              # find the matching closing brace
              j = src.index('{', i)
              depth = 0
              while j < len(src):
                  if src[j] == '{':
                      depth += 1
                  elif src[j] == '}':
                      depth -= 1
                      if depth == 0:
                          j += 1
                          break
                  j += 1
              # eat the trailing newline
              while j < len(src) and src[j] == '\n':
                  j += 1
              return src[:start] + src[j:], True

          for header in ('String repairIndic(String input) {',
                         '  static String _textFromResult(RecognizedText t) {',
                         '  static String _tidyLayer(PdfPageRawText t) {',
                         '  static Future<Uint8List> _preparePage(Uint8List png) async {'):
