                  double? height;
                  for (final sym in l.symbols) {
                    final r = sym.boundingBox;
                    final h = (r.bottom - r.top).abs();
                    if (lastRight != null && height != null) {
                      if ((r.left - lastRight) > height * 0.32) out.write(' ');
                    }
                    out.write(sym.text);
                    lastRight = r.right;
                    height = h;
                  }
                  out.write('\\n');
                }
                out.write('\\n');
              }
              final rebuilt = out.toString().trim();
              return rebuilt.isEmpty ? t.text : rebuilt;
            }

