                pieces.add(buf.toString());
                buf = StringBuffer();
              }
            }
            if (buf.isNotEmpty) pieces.add(buf.toString());

            final pages = <String>[];
            var out = StringBuffer();
            for (var p in pieces) {
              while (p.length > maxLen) {
                var cut = p.lastIndexOf(RegExp(r'[.!?\\u0964]\\s'), maxLen);
                if (cut <= 0) cut = p.lastIndexOf(' ', maxLen);
                cut = cut <= 0 ? maxLen : cut + 1;
                final head = p.substring(0, cut).trim();
                if (head.isNotEmpty) {
                  if (out.length > 0) {
                    pages.add(out.toString().trim());
                    out = StringBuffer();
                  }
                  pages.add(head);
                }
                p = p.substring(cut).trim();
              }
              if (p.isEmpty) continue;
              if (out.length > 0 && out.length + p.length > maxLen) {
                pages.add(out.toString().trim());
                out = StringBuffer();
              }
              out.writeln(p);
            }
            if (out.length > 0) pages.add(out.toString().trim());
            return pages;
          }'''

