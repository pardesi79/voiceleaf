name: Build Voiceleaf APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack the project from voiceleaf-src.zip
        run: |
          mkdir -p app
          unzip -o voiceleaf-src.zip -d app
          ls -la app

      - name: Create the Android shell
        working-directory: app
        run: flutter create --org com.voiceleaf --project-name voiceleaf .

      - name: Set permissions, camera, TTS and the app name
        working-directory: app
        run: python3 tool/patch_android.py

      - name: Keep the audio recorder plugin on a working version
        working-directory: app
        run: |
          grep -q "dependency_overrides" pubspec.yaml || printf '\ndependency_overrides:\n  record_linux: 1.3.1\n' >> pubspec.yaml
          tail -3 pubspec.yaml

      - name: Raise the Android SDK level and add the text recognition scripts
        working-directory: app
        run: |
          cat > /tmp/patch2.py <<'PY'
          import re, pathlib

          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'compileSdkVersion\s+(flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', s, count=1)
          s = re.sub(r'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', s, count=1)

          deps = (
              "    implementation 'com.google.mlkit:text-recognition:16.0.1'\n"
              "    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'\n"
              "    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'\n"
              "    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'\n"
              "    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'\n"
          )
          if 'text-recognition-devanagari' not in s:
              m = re.search(r'dependencies\s*\{', s)
              if m:
                  s = s[:m.end()] + '\n' + deps + s[m.end():]
          p.write_text(s)

          root = pathlib.Path('android/build.gradle')
          r = root.read_text()
          if 'subprojects' not in r:
              r += '''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          '''
              root.write_text(r)
          print('gradle patched')
          PY
          python3 /tmp/patch2.py

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      - name: Build the APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
