              final tmp = await getTemporaryDirectory();
              final pages = <String>[];
              try {
                final total = to - from + 1;
                var empty = 0;
                for (var i = from; i <= to; i++) {
                  onProgress(i - from + 1, total, -1);
                  final page = doc.pages[i - 1];
