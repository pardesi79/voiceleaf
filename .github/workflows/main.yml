nchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('extractors: page cleaner')\n\nold = \"\"\"        final bytes = await _pagePng(page);\n        if (bytes.isEmpty) {\"\"\"\nnew = \"\"\"        final raw = await _pagePng(page);\n        final bytes = raw.isEmpty ? raw : await _preparePage(raw);\n        if (bytes.isEmpty) {\"\"\"\nif old in s:\n    s = s.replace(old, new, 1)\n    changed.append('extractors: clean each page')\n\nex.write_text(s)\nprint('patched:', ', '.join(changed) if changed else 'nothing')\nPY\npython3 /tmp/patch_prep.py\n"
