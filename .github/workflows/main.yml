  ['@', '/'],\n  ['µ', '—'],\n  ['f', 'ि'],\n  ['Z', 'र्'],\n];\n\nconst String _cons = '\\u0915-\\u0939\\u0958-\\u095F';\n\nString _walkmanPre(String t) {\n  t = t.replaceAllMapped(RegExp(r'o([sSqwkah`\\u201a\\u00a1]{0,2})Q'), (m) => 'd${m[1]}');\n  t = t.replaceAllMapped(RegExp(r'i([sSqwkah`\\u201a\\u00a1]{0,2})Q'), (m) => 'Q${m[1]}');\n  t = t.replaceAll('mQ', '\\u00c5');\n  return t;\n}\n\n/// Repairs the table cannot express. Each was measured on a real NCERT\n/// chapter and kept only when the score rose.\nString repairLegacyOutput(String t) {\n  var s = t;\n  s = s.replaceAll('\\u092c\\u092c', '\\u092c\\u093f\\u0902');\n  s = s.replaceAll('\\u0915\\u092a', '\\u092a\\u093f\\u0902');\n  s = s.replaceAll('\\u091c\\u093c\\u093e', '\\u091c\\u093c');\n  s = s.replaceAll('(', '\\u0926\\u094d\\u0927');\n  s = s.replaceAll('\\u090b', ';');\n  s = s.replaceAll(RegExp(r'\\u0924\\u094d\\u092e\\u091a\\u0924\\u092a\\u0926\\u091c[\\d.]*'), '');\n  return s;\n}\n\nString legacyToUnicode(String input, {bool walkman = true}) {\n  var t = walkman ? _walkmanPre(input) : input;\n  for (final p in krutiPairs) {\n    if (p[0].isEmpty) continue;\n    t = t.replaceAll(p[0], p[1]);\n  }\n  // the short-i may be written before the anusvara of its own letter\n  t = t.replaceAllMapped(RegExp('\\u093f(\\u0902)([$_cons])'),\n      (m) => m[2]! + '\\u093f' + m[1]!);\n  t = t.replaceAllMapped(RegExp('\\u093f([$_cons])(\\u094d[$_cons])?'),\n      (m) => m[1]! + (m[2] ?? '') + '\\u093f');\n  t = t.replaceAllMapped(\n      RegExp('([$_cons][\\u093e-\\u094c]?(?:\\u094d[$_cons][\\u093e-\\u094c]?)?)\\u0930\\u094d'),\n      (m) => '\\u0930\\u094d${m[1]}');\n  t = t.replaceAllMapped(RegExp('\\u090b(?=\\\\s|\\$|[\\u0964,;:])'), (m) => ';');\n  return repairLegacyOutput(t);\n}\n\nbool isLegacyHindiText(String t) {\n  final words = t.split(RegExp(r'\\s+')).where((w) => w.isNotEmpty).toList();\n  if (words.length < 6) return false;\n  const markers = <String>{\n    'dks', 'ds', 'dh', 'dk', 'ls', 'es', '