name: Build Voiceleaf APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Create the Android shell
        run: flutter create --org com.voiceleaf --project-name voiceleaf .

      - name: Set permissions, camera, TTS and the app name
        run: python3 tool/patch_android.py

      - name: Appear in Open with and take the file
        run: |
          cat > /tmp/patch_openwith.py <<'PY'
          import os, pathlib, re
          changed = []
          PKG = 'com.voiceleaf.voiceleaf'
          MIME = '''                <data android:mimeType="application/pdf"/>
                          <data android:mimeType="text/plain"/>
                          <data android:mimeType="application/msword"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/>
                          <data android:mimeType="application/vnd.ms-powerpoint"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation"/>
                          <data android:mimeType="application/vnd.ms-excel"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>'''
          kt = pathlib.Path('android/app/src/main/kotlin/%s/MainActivity.kt' % PKG.replace('.', '/'))
          if kt.parent.exists() or pathlib.Path('android/app').exists():
              kt.parent.mkdir(parents=True, exist_ok=True)
              kt.write_text('''package %s
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import java.io.File
          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  handleIntent(intent)
                  super.onCreate(savedInstanceState)
              }
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIntent(intent)
              }
              private fun handleIntent(intent: Intent?) {
                  if (intent == null) return
                  val uri: Uri? = when (intent.action) {
                      Intent.ACTION_VIEW -> intent.data
                      Intent.ACTION_SEND -> {
                          @Suppress("DEPRECATION")
                          intent.getParcelableExtra(Intent.EXTRA_STREAM) as? Uri
                      }
                      else -> null
                  }
                  if (uri == null) return
                  try {
                      val name = queryName(uri) ?: "opened_file"
                      val dir = File(cacheDir, "incoming")
                      dir.mkdirs()
                      val out = File(dir, name)
                      contentResolver.openInputStream(uri)?.use { input ->
                          out.outputStream().use { output -> input.copyTo(output) }
                      }
                      getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)
                          .edit()
                          .putString("flutter.pending_file", out.absolutePath)
                          .apply()
                  } catch (e: Exception) {
                      // If anything goes wrong the app still opens normally.
                  }
              }
              private fun queryName(uri: Uri): String? {
                  if (uri.scheme == "file") return uri.lastPathSegment
                  try {
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val idx = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                      }
                  } catch (e: Exception) {
                  }
                  return uri.lastPathSegment
              }
          }
          ''' % PKG)
              changed.append('MainActivity.kt')
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if mf.exists():
              xml = mf.read_text()
              if 'android.intent.action.VIEW' not in xml:
                  filters = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
          %s
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
          %s
                      </intent-filter>
          ''' % (MIME, MIME)
                  xml = re.sub(r'(<activity[^>]*android:name="\.MainActivity"[^>]*>)',
                               r'\1' + filters, xml, count=1)
                  if 'android.intent.action.VIEW' not in xml:
                      xml = xml.replace('</activity>', filters + '        </activity>', 1)
                  xml = xml.replace('android:launchMode="singleTop"', '')
                  xml = re.sub(r'(<activity[^>]*android:name="\.MainActivity")',
                               r'\1 android:launchMode="singleTop"', xml, count=1)
                  mf.write_text(xml)
                  changed.append('AndroidManifest.xml')
          m = pathlib.Path('lib/main.dart')
          s = m.read_text()
          if 'gPendingFile' not in s:
              s = s.replace("Future<void> main() async {", "String? gPendingFile;\n\nFuture<void> main() async {", 1)
              s = s.replace("  await L10n.I.load();\n  runApp(const VoiceleafApp());",
                            "  await L10n.I.load();\n  gPendingFile = AppPrefs.I.str('pending_file');\n"
                            "  if (gPendingFile != null) await AppPrefs.I.remove('pending_file');\n"
                            "  runApp(const VoiceleafApp());", 1)
              s = s.replace("home: const HomePage(),", "home: HomePage(initialFile: gPendingFile),", 1)
              m.write_text(s)
              changed.append('main.dart')
          h = pathlib.Path('lib/home_page.dart')
          s = h.read_text()
          if 'initialFile' not in s:
              s = s.replace("class HomePage extends StatefulWidget {\n  const HomePage({super.key});",
                            "class HomePage extends StatefulWidget {\n  final String? initialFile;\n"
                            "  const HomePage({super.key, this.initialFile});", 1)
              if 'initialFile' not in s:
                  s = s.replace("  const HomePage({super.key});",
                                "  final String? initialFile;\n  const HomePage({super.key, this.initialFile});", 1)
              s = s.replace("""  @override
            void initState() {
              super.initState();
              _load();
            }""",
          """  @override
            void initState() {
              super.initState();
              _load();
              final f = widget.initialFile;
              if (f != null) {
                WidgetsBinding.instance.addPostFrameCallback((_) => _openIncoming(f));
              }
            }
            /// A PDF, DOCX or text file handed to us by another app's "Open with".
            Future<void> _openIncoming(String path) async {
              final name = path.split('/').last;
              final title = name.contains('.') ? name.substring(0, name.lastIndexOf('.')) : name;
              final ext = name.contains('.') ? name.split('.').last.toLowerCase() : '';
              List<String> pages = [];
              try {
                if (ext == 'pdf') {
                  final n = await Extractors.pdfPageCount(path);
                  pages = await Extractors.pdf(path, AppPrefs.I.ocr, 1, n, (a, b, c) {});
                } else if (ext == 'docx') {
                  pages = await Extractors.docx(path);
                } else if (ext == 'pptx') {
                  pages = await Extractors.pptx(path);
                } else if (ext == 'xlsx') {
                  pages = await Extractors.xlsx(path);
                } else if (ext == 'zip') {
                  final b = await Extractors.restoreZip(path);
                  if (b != null) {
                    await Storage.save(b);
                    await _load();
                    if (mounted) _open(b);
                  }
                  return;
                } else {
                  pages = await Extractors.txt(path);
                }
              } catch (e) {
                toast(context, 'Could not read that file.');
                return;
              }
              if (pages.isEmpty) {
                toast(context, 'No readable text was found in that file.');
                return;
              }
              final b = Book(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                title: title,
                pages: pages,
              );
              await Storage.save(b);
              await _load();
              if (mounted) _open(b, autoStart: true);
            }""", 1)
              if "import 'extractors.dart';" not in s:
                  s = s.replace("import 'create_flow.dart';", "import 'app_prefs.dart';\nimport 'create_flow.dart';\nimport 'extractors.dart';", 1)
              h.write_text(s)
              changed.append('home_page.dart')
          print('patched:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/patch_openwith.py

      - name: Show the processing screen for an opened file
        run: |
          cat > /tmp/patch_openwith2.py <<'PY'
          import os, pathlib, re
          changed = []
          PKG = 'com.voiceleaf.voiceleaf'
          cf = pathlib.Path('lib/create_flow.dart')
          s = cf.read_text()
          if 'runCreateFromPath' not in s:
              helper = '''/// Builds an audiobook from a file another app handed to us.
          Future<Book?> runCreateFromPath(BuildContext context, String path) async {
            final ocr = AppPrefs.I.ocr;
            final fileName = path.split('/').last;
            final title = fileName.contains('.')
                ? fileName.substring(0, fileName.lastIndexOf('.'))
                : fileName;
            final ext = fileName.contains('.') ? fileName.split('.').last.toLowerCase() : '';
            Future<Book?> process(Future<Extracted?> Function(StatusFn) job) async {
              final out = await Navigator.push<_Outcome>(
                  context, MaterialPageRoute(builder: (_) => ProcessingPage(job: job)));
              if (!context.mounted || out == null) return null;
              if (out.error != null) {
                toast(context, 'Failed: ${out.error}');
                return null;
              }
              final ex = out.ex;
              if (ex == null || ex.pages.isEmpty) {
                toast(context, 'No readable text was found.');
                return null;
              }
              final b = Book(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                title: ex.title.isEmpty ? title : ex.title,
                pages: ex.pages,
              );
              await Storage.save(b);
              if (AppPrefs.I.flag('completeSound')) Sounds.play('complete');
              return b;
            }
            if (ext == 'pdf') {
              int count;
              try {
                count = await Extractors.pdfPageCount(path);
              } catch (_) {
                toast(context, 'Could not open this PDF.');
                return null;
              }
              if (!context.mounted) return null;
              final range = await Navigator.push<List<int>>(context,
                  MaterialPageRoute(builder: (_) => ChoosePagesPage(total: count)));
              if (range == null || !context.mounted) return null;
              return process((st) async {
                final pages = await Extractors.pdf(path, ocr, range[0], range[1],
                    (d, t, c) => st(
                        c < 0
                            ? 'Page $d of $t, reading'
                            : c == 0
                                ? 'Page $d of $t, no text found'
                                : 'Page $d of $t, $c characters',
                        speak: true),
                    pageNumbers: range[2] == 1);
                return Extracted(title, pages);
              });
            }
            if (ext == 'zip') {
              final b = await Extractors.restoreZip(path);
              if (b == null) {
                toast(context, 'That is not a Voiceleaf backup.');
                return null;
              }
              await Storage.save(b);
              return b;
            }
            return process((st) async {
              st('Reading file...');
              List<String> pages = [];
              if (ext == 'docx') {
                pages = await Extractors.docx(path);
              } else if (ext == 'pptx') {
                pages = await Extractors.pptx(path);
              } else if (ext == 'xlsx') {
                pages = await Extractors.xlsx(path);
              } else {
                pages = await Extractors.txt(path);
              }
              return Extracted(title, pages);
            });
          }
          '''
              anchor = "Future<Book?> runCreate(BuildContext context, String choice) async {"
              if anchor in s:
                  s = s.replace(anchor, helper + anchor, 1)
                  cf.write_text(s)
                  changed.append('create_flow: runCreateFromPath')
          h = pathlib.Path('lib/home_page.dart')
          s = h.read_text()
          start = s.find('  /// A PDF, DOCX or text file handed to us by another app')
          if start >= 0:
              end = s.find('  Future<void> _load()', start)
              if end < 0:
                  end = s.find('\n  void ', start)
              new_body = '''  /// A file handed to us by another app's "Open with".
            Future<void> _openIncoming(String path) async {
              final b = await runCreateFromPath(context, path);
              if (b == null) return;
              await _load();
              if (mounted) _open(b, autoStart: true);
            }
          '''
              s = s[:start] + new_body + s[end:]
              h.write_text(s)
              changed.append('home_page: call helper')
          print('patched:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/patch_openwith2.py

      - name: Use a stable signing key so a new build installs over the old app
        run: |
          mkdir -p android/app
          if [ ! -f android/app/voiceleaf.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/voiceleaf.jks \
              -storepass voiceleaf123 -keypass voiceleaf123 \
              -alias voiceleaf -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Voiceleaf, OU=App, O=Voiceleaf, L=Delhi, ST=Delhi, C=IN"
            git config user.name "voiceleaf-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -f android/app/voiceleaf.jks
            git commit -m "Add a stable signing key so updates install over the old app [skip ci]" || true
            git push || echo "could not push the key"
          fi

      - name: Keep the audio recorder plugin on a working version
        run: |
          grep -q "dependency_overrides" pubspec.yaml || printf '\ndependency_overrides:\n  record_linux: 1.3.1\n' >> pubspec.yaml
          tail -3 pubspec.yaml

      - name: Make the action sounds
        run: |
          cat > /tmp/make_sounds.py <<'PY'
          import math, os, random, struct, wave
          RATE = 22050
          def write(name, samples):
              path = os.path.join('assets', name)
              os.makedirs('assets', exist_ok=True)
              with wave.open(path, 'w') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(RATE)
                  w.writeframes(b''.join(struct.pack('<h', int(max(-1, min(1, s)) * 30000)) for s in samples))
              print('wrote', path, round(len(samples) / RATE, 3), 's')
          def fade(samples, ms=4):
              n = int(RATE * ms / 1000)
              for i in range(min(n, len(samples))):
                  samples[i] *= i / n
              for i in range(min(n, len(samples))):
                  samples[-1 - i] *= i / n
              return samples
          def paper_flip(sec=0.18):
              """A soft paper swish. Bright noise only, no low hum, so it never thuds."""
              n = int(RATE * sec)
              random.seed(11)
              out = []
              lp = 0.0
              for i in range(n):
                  t = i / RATE
                  x = t / sec
                  env = (x ** 0.5) * math.exp(-7.0 * x)
                  lp = lp + 0.45 * (random.uniform(-1, 1) - lp)
                  out.append(lp * env * 0.8)
              return fade(out, 5)
          def two_tone():
              n1 = int(RATE * 0.28)
              a = [math.sin(2 * math.pi * 880 * (i / RATE)) * math.exp(-9 * (i / RATE)) * 0.5 for i in range(n1)]
              n2 = int(RATE * 0.55)
              b = [math.sin(2 * math.pi * 1318 * (i / RATE)) * math.exp(-6 * (i / RATE)) * 0.45 for i in range(n2)]
              return fade(a) + [0.0] * int(RATE * 0.05) + fade(b)
          def soft_tick(freq=480.0, sec=0.06, amp=0.22):
              n = int(RATE * sec)
              out = []
              for i in range(n):
                  t = i / RATE
                  env = math.exp(-45 * t)
                  out.append(math.sin(2 * math.pi * freq * t) * env * amp)
              return fade(out, 4)
          def working_loop():
              """Quiet, slow tick so it can run for minutes without getting annoying."""
              return soft_tick(480, 0.06, 0.22) + [0.0] * int(RATE * 1.34)
          def blip():
              n = int(RATE * 0.12)
              out = []
              for i in range(n):
                  t = i / RATE
                  f = 980 - 380 * (t / 0.12)
                  out.append(math.sin(2 * math.pi * f * t) * math.exp(-24 * t) * 0.5)
              return fade(out)
          write('snd_pageflip.wav', paper_flip())
          write('snd_complete.wav', two_tone())
          write('snd_paste.wav', blip())
          write('snd_working.wav', working_loop())
          write('snd_tap.wav', soft_tick(900, 0.05, 0.3))
          PY
          python3 /tmp/make_sounds.py

      - name: Wire the sounds into the app
        run: |
          cat > /tmp/patch_sounds.py <<'PY'
          import pathlib
          changed = []
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          if '- assets/\n' not in s:
              s = s.replace('  assets:\n', '  assets:\n    - assets/\n', 1)
              p.write_text(s)
              changed.append('pubspec.yaml')
          w = pathlib.Path('lib/widgets.dart')
          s = w.read_text()
          if 'class Sounds' not in s:
              s += '''
          /// Short interface sounds. The wav files are generated at build time.
          /// They never take audio focus, so the reading voice is not interrupted.
          class Sounds {
            static final AudioPlayer _one = AudioPlayer();
            static final AudioPlayer _loop = AudioPlayer();
            static bool _ready = false;
            static Future<void> _init() async {
              if (_ready) return;
              _ready = true;
              final ctx = AudioContext(
                android: AudioContextAndroid(
                  contentType: AndroidContentType.sonification,
                  usageType: AndroidUsageType.assistanceSonification,
                  audioFocus: AndroidAudioFocus.none,
                ),
              );
              try {
                await _one.setAudioContext(ctx);
                await _loop.setAudioContext(ctx);
              } catch (_) {}
            }
            static Future<void> play(String name) async {
              try {
                await _init();
                await _loop.stop();
                await _one.stop();
                await _one.play(AssetSource('snd_$name.wav'), volume: 1.0);
              } catch (_) {}
            }
            static Future<void> loop(String name) async {
              try {
                await _init();
                await _loop.stop();
                await _loop.setReleaseMode(ReleaseMode.loop);
                await _loop.play(AssetSource('snd_$name.wav'), volume: 0.55);
              } catch (_) {}
            }
            static Future<void> stopLoop() async {
              try {
                await _loop.stop();
              } catch (_) {}
            }
          }
          '''
              if "package:audioplayers/audioplayers.dart" not in s:
                  s = s.replace("import 'package:flutter/material.dart';",
                                "import 'package:audioplayers/audioplayers.dart';\nimport 'package:flutter/material.dart';", 1)
              w.write_text(s)
              changed.append('lib/widgets.dart')
          pp = pathlib.Path('lib/player_page.dart')
          s = pp.read_text()
          n = s.count('SystemSound.play(SystemSoundType.click);')
          if n:
              s = s.replace('SystemSound.play(SystemSoundType.click);', "Sounds.play('pageflip');")
              pp.write_text(s)
              changed.append('lib/player_page.dart (%d)' % n)
          cf = pathlib.Path('lib/create_flow.dart')
          s = cf.read_text()
          if 'SystemSound.play(SystemSoundType.alert);' in s:
              s = s.replace('SystemSound.play(SystemSoundType.alert);', "Sounds.play('complete');")
              changed.append('create_flow: complete')
          old_init = """  @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addPostFrameCallback((_) => _go());
            }"""
          new_init = """  @override
            void initState() {
              super.initState();
              if (AppPrefs.I.flag('processingSound')) Sounds.loop('working');
              WidgetsBinding.instance.addPostFrameCallback((_) => _go());
            }"""
          if old_init in s and "Sounds.loop('working')" not in s:
              s = s.replace(old_init, new_init)
              changed.append('create_flow: loop start')
          old_dispose = """  @override
            void dispose() {
              voice?.stop();
              super.dispose();
            }"""
          new_dispose = """  @override
            void dispose() {
              voice?.stop();
              Sounds.stopLoop();
              super.dispose();
            }"""
          if old_dispose in s and 'Sounds.stopLoop();' not in s:
              s = s.replace(old_dispose, new_dispose)
              changed.append('create_flow: loop stop')
          cf.write_text(s)
          print('patched:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/patch_sounds.py

      - name: Read a two-page scan as two separate pictures
        run: |
          cat > /tmp/patch_spread3.py <<'PY'
          import pathlib
          changed = []
          ex = pathlib.Path('lib/extractors.dart')
          s = ex.read_text()
          if "import 'dart:ui' as ui;" not in s:
              s = s.replace("import 'dart:io';", "import 'dart:io';\nimport 'dart:typed_data';\nimport 'dart:ui' as ui;", 1)
              changed.append('extractors: ui import')
          elif "import 'dart:typed_data';" not in s:
              s = s.replace("import 'dart:ui' as ui;", "import 'dart:typed_data';\nimport 'dart:ui' as ui;", 1)
              changed.append('extractors: typed_data import')
          if '_cropHalf' not in s:
              s = s.replace("  static int _letters(String t) {",
          """  /// Cuts a slice out of a picture and gives it back as PNG bytes.
            static Future<Uint8List> _cropHalf(ui.Image src, int x, int w) async {
              final rec = ui.PictureRecorder();
              final canvas = ui.Canvas(rec);
              canvas.drawImageRect(
                src,
                ui.Rect.fromLTWH(x.toDouble(), 0, w.toDouble(), src.height.toDouble()),
                ui.Rect.fromLTWH(0, 0, w.toDouble(), src.height.toDouble()),
                ui.Paint(),
              );
              final pic = rec.endRecording();
              final out = await pic.toImage(w, src.height);
              final data = await out.toByteData(format: ui.ImageByteFormat.png);
              return data!.buffer.asUint8List();
            }
            static int _letters(String t) {""", 1)
              changed.append('extractors: crop helper')
          old = "        final text = await ocrFile(f, mode);"
          new = """        String text;
                  if (w > h) {
                    // A scanned book often shows two pages side by side. Read each half
                    // on its own, otherwise the two pages get mixed together line by line.
                    final codec = await ui.instantiateImageCodec(img.bytes);
                    final frame = await codec.getNextFrame();
                    final full = frame.image;
                    final half = full.width ~/ 2;
                    final lb = await _cropHalf(full, 0, half);
                    final rb = await _cropHalf(full, half, full.width - half);
                    final lf = File('${tmp.path}/pg_${i}_l.png');
                    final rf = File('${tmp.path}/pg_${i}_r.png');
                    await lf.writeAsBytes(lb);
                    await rf.writeAsBytes(rb);
                    final lt = await ocrFile(lf, mode);
                    final rt = await ocrFile(rf, mode);
                    await lf.delete();
                    await rf.delete();
                    text = '$lt\\n$rt';
                  } else {
                    text = await ocrFile(f, mode);
                  }"""
          if old in s:
              s = s.replace(old, new)
              changed.append('extractors: read halves')
          ex.write_text(s)
          h = pathlib.Path('lib/home_page.dart')
          s = h.read_text()
          old_pdf = """      if (ext == 'pdf') {
                  final n = await Extractors.pdfPageCount(path);
                  pages = await Extractors.pdf(path, AppPrefs.I.ocr, 1, n, (a, b, c) {});
                }"""
          new_pdf = """      if (ext == 'pdf') {
                  final n = await Extractors.pdfPageCount(path);
                  if (!mounted) return;
                  final range = await Navigator.push<List<int>>(context,
                      MaterialPageRoute(builder: (_) => ChoosePagesPage(total: n)));
                  if (range == null) return;
                  pages = await Extractors.pdf(
                      path, AppPrefs.I.ocr, range[0], range[1], (a, b, c) {});
                }"""
          if old_pdf in s:
              s = s.replace(old_pdf, new_pdf)
              h.write_text(s)
              changed.append('home_page: page range')
          print('patched:', ', '.join(changed) if changed else 'nothing')
          PY
          python3 /tmp/patch_spread3.py

      - name: Fetch packages
        run: flutter pub get

      - name: Raise the Android SDK level and add the text recognition scripts
        run: |
          cat > /tmp/patch_gradle.py <<'PY'
          import os, re, pathlib, glob

          def bump(text):
              text = re.sub(r'compileSdkVersion\s+(flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', text)
              text = re.sub(r'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', text)
              text = re.sub(r'compileSdk\s+(flutter\.compileSdkVersion|\d+)', 'compileSdk 36', text)
              return text

          fixed = 0
          for g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle*')):
              p = pathlib.Path(g)
              try:
                  s = p.read_text()
              except Exception:
                  continue
              n = bump(s)
              if n != s:
                  p.write_text(n)
                  fixed += 1
          print('plugin gradle files raised:', fixed)

          app = None
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if os.path.exists(name):
                  app = pathlib.Path(name)
                  break
          if app is None:
              raise SystemExit('app gradle not found')

          s = app.read_text()
          s = bump(s)

          kts = app.name.endswith('.kts')
          if kts:
              extra = """
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("voiceleaf.jks")
                      storePassword = "voiceleaf123"
                      keyAlias = "voiceleaf"
                      keyPassword = "voiceleaf123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          """
              deps = """
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          """
              root_extra = """
          subprojects {
              tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }
          }
          """
          else:
              extra = """
          android {
              signingConfigs {
                  release {
                      storeFile file("voiceleaf.jks")
                      storePassword "voiceleaf123"
                      keyAlias "voiceleaf"
                      keyPassword "voiceleaf123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          """
              deps = """
          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
          }
          """
              root_extra = """
          subprojects {
              tasks.matching { it.name.startsWith('lintVital') }.configureEach { enabled = false }
          }
          """

          if 'text-recognition-devanagari' not in s:
              s += deps
          if 'isMinifyEnabled = false' not in s and 'minifyEnabled false' not in s:
              s += extra
          app.write_text(s)
          print('patched', app)

          root = None
          for name in ('android/build.gradle.kts', 'android/build.gradle'):
              if os.path.exists(name):
                  root = pathlib.Path(name)
                  break
          if root is not None:
              r = root.read_text()
              if 'lintVital' not in r:
                  root.write_text(r + root_extra)
                  print('patched', root)
          PY
          python3 /tmp/patch_gradle.py

      - name: Build the APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Put the phone APK where it can be downloaded directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk voiceleaf.apk
          gh release create latest voiceleaf.apk \
            --title "Voiceleaf latest" \
            --notes "Built from the newest commit. Download voiceleaf.apk and install it." \
            --latest || gh release upload latest voiceleaf.apk --clobber

      - name: Hand back the APKs
        uses: actions/upload-artifact@v4
        with:
          name: voiceleaf-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
