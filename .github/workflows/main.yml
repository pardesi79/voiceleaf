    - name: Make the ink darker and the paper whiter
      run: "cat > /tmp/patch_contrast.py <<'PY'\nimport pathlib\n\nchanged = []\np = pathlib.Path('pubspec.yaml')\ns = p.read_text()\nif 'image:' not in s:\n    s = s.replace('  flutter_image_compress: ^2.3.0', '  flutter_image_compress: ^2.3.0\\n  image: ^4.2.0', 1)\n    p.write_text(s)\n    changed.append('pubspec: image back for contrast')\n\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\nif \"package:image/image.dart\" not in s:\n    s = s.replace(\"import 'package:flutter_image_compress/flutter_image_compress.dart';\",\n                  \"import 'package:flutter_image_compress/flutter_image_compress.dart';\\nimport 'package:image/image.dart' as im;\", 1)\n\nstart = s.index('  static Future<Uint8List> _preparePage(Uint8List png) async {')\nend = s.index('\\n  }\\n', start) + len('\\n  }\\n')\nnew = '''  /// Makes the page easier to read: grey, with the ink darker and the paper\n  /// whiter. A test of scanned pages found that contrast decided whether text\n  /// was recognised at all, while more pixels changed nothing.\n  static Future<Uint8List> _preparePage(Uint8List png) async {\n    try {\n      final src = im.decodeImage(png);\n      if (src == null) return png;\n      var out = im.grayscale(src);\n      out = im.adjustColor(out, contrast: 1.35, saturation: 1);\n      const wide = 1600;\n      if (out.width > wide) {\n        final h = (out.height * wide / out.width).round();\n        out = im.copyResize(out,\n            width: wide, height: h, interpolation: im.Interpolation.average);\n      }\n      return Uint8List.fromList(im.encodePng(out, level: 1));\n    } catch (_) {\n      return png;\n    }\n  }\n'''\ns = s[:start] + new + s[end:]\nchanged.append('extractors: grey plus contrast')\nex.write_text(s)\nprint('patched:', ', '.join(changed))\nPY\npython3 /tmp/patch_contrast.py\n"
