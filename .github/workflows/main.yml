      run: "cat > /tmp/patch_words.py <<'PY'\nimport pathlib\n\nchanged = []\nex = pathlib.Path('lib/extractors.dart')\ns = ex.read_text()\n\n# ---------- 1. rebuild the text from the words and their positions\nanchor = \"  /// Reads one image on the phone with Google ML Kit (offline).\"\nhelper = '''  /// ML Kit hands back words with their own boxes. Rebuilding the line from\n  /// those boxes keeps words apart only where there is a real gap, so Hindi\n  /// matras stop being split off with a space of their own.\n  static String _textFromResult(RecognizedText t) {\n    final out = StringBuffer();\n    for (final b in t.blocks) {\n      for (final l in b.lines) {\n        final els = l.elements;\n        if (els.isEmpty) {\n          if (l.text.trim().isNotEmpty) out.writeln(l.text.trim());\n          continue;\n        }\n        TextElement? prev;\n        for (final e in els) {\n          if (prev != null) {\n            final pr = prev.boundingBox;\n            final er = e.boundingBox;\n            final h = (er.bottom - er.top).abs();\n            final gap = er.left - pr.right;\n            if (gap > h * 0.45) out.write(' ');\n          }\n          out.write(e.text);\n          prev = e;\n        }\n        out.write('\\\\n');\n      }\n      out.write('\\\\n');\n    }\n    final rebuilt = out.toString().trim();\n    return rebuilt.isEmpty ? t.text : rebuilt;\n  }\n\n'''\nif '_textFromResult' not in s and anchor in s:\n    s = s.replace(anchor, helper + anchor, 1)\n    changed.append('extractors: rebuild from word boxes')\n\nold_run = \"\"\"        rec = TextRecognizer(script: _script(m));\n        final t = await rec.processImage(InputImage.fromFile(f));\n        return t.text;\"\"\"\nnew_run = \"\"\"        rec = TextRecognizer(script: _script(m));\n        final t = await rec.processImage(InputImage.fromFile(f));\n        return _textFromResult(t);\"\"\"\nif old_run in s:\n    s = s.replace(old_run, new_run, 1)\n    changed.append('extractors: use rebuilt