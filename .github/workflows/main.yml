                              hint: const Text('System Default Voice for Language'),
                              items: [
                                const DropdownMenuItem<String>(
                                  value: '',
                                  child: Text('Default Voice (Auto)'),
                                ),
                                ...matchingVoices.map((v) {
                                  final vName = (v['name'] ?? '').toString();
                                  final net = v['network'] == true ? 'Online' : 'Offline';
                                  return DropdownMenuItem<String>(
                                    value: vName,
                                    child: Text('$vName [$net]', overflow: TextOverflow.ellipsis),
