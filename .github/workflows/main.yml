            if (text.isEmpty) return [];
            // Put the broken lines back into flowing sentences. Only a real sentence end
            // starts a new piece, so the reading voice does not stop after every line.
            final pieces = <String>[];
            var buf = StringBuffer();
            for (final line in text.split('\\n')) {
              final t = line.trim();
              if (t.isEmpty) {
                if (buf.isNotEmpty) {
                  pieces.add(buf.toString());
                  buf = StringBuffer();
