name: Unpack the source into the repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Unpack and commit
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Unpack the newest zip
        run: |
          ZIP=$(ls -t *.zip | head -1)
          echo "using $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          cp -r /tmp/src/lib .
          cp -r /tmp/src/assets .
          cp /tmp/src/pubspec.yaml .
          cp /tmp/src/README.md .
          if [ -d /tmp/src/tool ]; then cp -r /tmp/src/tool .; fi

      - name: Commit the files
        run: |
          git config user.name "voiceleaf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A lib assets pubspec.yaml README.md tool
          git commit -m "Unpack the source files into the repository" || echo "nothing new"
          git push
